apiVersion: nanohype/v1

name: rag-pipeline
displayName: 'RAG Pipeline'
description: >
  Scaffolds a Retrieval-Augmented Generation pipeline in TypeScript.
  Implements document ingestion, configurable chunking strategies,
  embedding generation, vector storage, similarity retrieval, and
  LLM-powered answer generation with source citations. No LangChain —
  every component is built from first principles: a model call goes to
  the ModelGateway over fetch, or to Bedrock through the AWS SDK, and each
  vector store is reached through its own client. Defaults to the
  Platform's ModelGateway for generation
  (Claude over native Messages, prompt-cached) and embeddings, so the
  pipeline holds no model credential. Supports multiple vector stores
  (pgvector, Chroma, Qdrant, Pinecone), and Bedrock called directly under
  the AWS credential chain off the substrate. No provider holds a provider
  key.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: ai-systems
tags: [typescript, rag, embeddings, vector-search, llm, retrieval, ai, model-gateway, bedrock]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used in package.json and directory names'
    prompt: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'A retrieval-augmented generation pipeline'

  - name: VectorStore
    type: string
    placeholder: '__VECTOR_STORE__'
    description: 'Vector database backend for storing and querying embeddings (e.g. chroma, pgvector, qdrant, pinecone)'
    prompt: 'Vector store'
    default: 'chroma'

  - name: EmbeddingProvider
    type: string
    placeholder: '__EMBEDDING_PROVIDER__'
    description: 'Provider for text embeddings: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), bedrock (Titan v2, called directly under the AWS credential chain, off the substrate), or a custom name'
    prompt: 'Embedding provider'
    default: 'gateway'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider for answer generation: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), bedrock (called directly under the AWS credential chain, off the substrate), or a custom name'
    prompt: 'LLM provider'
    default: 'gateway'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR this project deploys under. The gateway providers default MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: ChunkStrategy
    type: string
    placeholder: '__CHUNK_STRATEGY__'
    description: 'Text chunking strategy for splitting documents'
    prompt: 'Chunking strategy'
    default: 'recursive'

  - name: IncludeTests
    type: bool
    placeholder: '__INCLUDE_TESTS__'
    description: 'Include the vitest config and the chunking, retrieval and registry suites, with the gateway and bedrock request suites'
    prompt: 'Include tests?'
    default: true

conditionals:
  - path: 'vitest.config.ts'
    when: IncludeTests
  - path: 'src/__tests__/chunking.test.ts'
    when: IncludeTests
  - path: 'src/__tests__/retrieval.test.ts'
    when: IncludeTests
  - path: 'src/__tests__/registry.test.ts'
    when: IncludeTests
  - path: 'src/providers/__tests__/gateway-request.test.ts'
    when: IncludeTests
  - path: 'src/providers/__tests__/bedrock-request.test.ts'
    when: IncludeTests

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [agentic-loop, eval-harness, go-service]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for TypeScript execution'
    optional: false
