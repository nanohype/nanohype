# Platform CR — declares the tenant boundary. Apply this ONCE during initial tenant
# setup (kubectl apply -f platform.yaml). Two CRs:
#   - BudgetPolicy (governance.nanohype.dev) — referenced by Platform.spec.budget (required)
#   - Platform     (platform.nanohype.dev)   — the tenant declaration
#
# The eks-agent-platform operator reconciles from the Platform CR:
#   - Namespace tenants-__TENANT__ (Pod Security Standards baseline label)
#   - ResourceQuota + LimitRange
#   - Default-deny NetworkPolicy (the chart layers app-specific egress on top)
#   - ArgoCD AppProject scoped to this Platform
#   - Per-Platform IAM role: a baseline policy + spec.identity.extraPolicyArns,
#     scoped to the families in spec.identity.allowedModelFamilies, plus a
#     datastore-access policy generated from spec.datastores and a
#     capability-access policy generated from spec.identity.capabilities
# The datastores declared below are provisioned by the generic tenant-substrate
# module from this same declaration — there is no per-app substrate component.
# BudgetPolicy drives the spend kill-switch (fires at 120% of monthlyUsd when
# killSwitchEnabled).
#
# The chart's pod identity comes from this CR: the eks-agent-platform operator
# creates and owns the `tenant-runtime` ServiceAccount and binds it to the
# per-Platform IAM role via an EKS Pod Identity association, so the pod runs as
# it and the chart carries no role ARN (serviceAccount.create: false).
#
# Once Platform.status.phase is Ready, the ApplicationSet entry in __GITOPS_REPO__
# takes over reconciling the chart.

---
apiVersion: governance.nanohype.dev/v1alpha1
kind: BudgetPolicy
metadata:
  name: __APP_NAME__
  namespace: tenants-__TENANT__
spec:
  platformRef:
    name: __APP_NAME__
  # Soft monthly cap (USD). The kill-switch fires at 120% when enabled.
  monthlyUsd: "__MONTHLY_USD__"
  alertThresholdsPercent: [50, 80, 100]
  killSwitchEnabled: true
---
apiVersion: platform.nanohype.dev/v1alpha1
kind: Platform
metadata:
  name: __APP_NAME__
  namespace: tenants-__TENANT__
spec:
  displayName: __APP_NAME__
  # persona ∈ sales-ops | support | finance | ops | founder | eng | marketing |
  # legal | generic — drives default guardrails, dashboards, and fleet shape.
  persona: __PERSONA__
  tenant: __TENANT__
  budget:
    name: __APP_NAME__
  identity:
    # Bedrock access. allowedModelFamilies and allowedModels are mutually
    # exclusive — families are expanded to model ARNs by the controller.
    allowedModelFamilies:
      - anthropic
    # Extra managed IAM policies attached on top of the per-tenant baseline.
    # The escape hatch for grants outside both the datastore and capability
    # vocabularies — not for SES or EventBridge Scheduler, which are capabilities.
    extraPolicyArns: []
    # Managed AWS capabilities the datastore vocabulary doesn't cover; the
    # operator generates the scoped grants from this list. Omit the field if the
    # tenant needs none.
    #   ses                  — send email (ses:SendEmail, FromAddress-scoped to
    #                          the tenant's sending domain)
    #   eventBridgeScheduler — create + fire schedules; the operator mints the
    #                          scheduler-invoke role targeting the tenant's queues
    # capabilities:
    #   - ses
  compliance:
    soc2: true
    hipaa: false
  isolation: namespace   # or vcluster for hard isolation
  # Stateful substrate the tenant needs. Each entry names a datastore and its
  # kind — relational | keyValue | objectStore | queue | cache | stream. The
  # generic tenant-substrate module provisions each one and the operator
  # generates the scoped IAM to reach it. Omit a kind's config block to take the
  # young/light defaults (keyValue requires its partitionKey). deletionPolicy
  # defaults to Retain, so deleting this CR orphans the datastore intact.
  # Remove this block if the tenant has no stateful needs.
  datastores:
    - name: main
      kind: relational
    - name: events
      kind: queue
      queue:
        maxReceiveCount: 3
