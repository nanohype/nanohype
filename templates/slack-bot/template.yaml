apiVersion: nanohype/v1

name: slack-bot
displayName: 'Slack Bot'
description: >
  Scaffolds a TypeScript Slack bot using @slack/bolt with Socket Mode for
  local development and HTTP for production. Includes AI-powered message
  and app-mention handlers, an optional /ask slash command, a pluggable
  LLM provider registry that defaults to the Platform's ModelGateway and
  holds no model credential (a direct Bedrock Converse provider with prompt
  caching, under the AWS credential chain, for use off the substrate; no
  provider holds a provider key), and thread-aware conversation context for
  multi-turn AI responses.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: applications
tags: [typescript, slack, bot, ai, chatbot, model-gateway, bedrock]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used as package name and directory'
    prompt: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'A Slack bot with AI'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'Default LLM provider: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), bedrock (Bedrock called directly under the AWS credential chain, off the substrate), mock, or a custom name'
    prompt: 'LLM provider'
    default: 'gateway'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR this project deploys under. The gateway provider defaults MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: IncludeSlashCommands
    type: bool
    placeholder: '__INCLUDE_SLASH_COMMANDS__'
    description: 'Include the /ask slash command'
    prompt: 'Include slash commands?'
    default: true

  - name: IncludeTests
    type: bool
    placeholder: '__INCLUDE_TESTS__'
    description: 'Include test files with vitest'
    prompt: 'Include tests?'
    default: true

conditionals:
  - path: 'src/commands/ask.ts'
    when: IncludeSlashCommands
  - path: 'vitest.config.ts'
    when: IncludeTests
  - path: 'src/__tests__/message.test.ts'
    when: IncludeTests
  - path: 'src/providers/__tests__/gateway.test.ts'
    when: IncludeTests

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [module-queue-ts, module-database-ts, agentic-loop]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for the Slack bot'
    optional: false
