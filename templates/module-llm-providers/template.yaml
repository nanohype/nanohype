apiVersion: nanohype/v1

name: module-llm-providers
displayName: 'Module: LLM Providers'
description: >
  Shared LLM provider pack — the canonical interface for all AI templates.
  Defaults to the gateway provider, which calls the Platform's ModelGateway
  and holds no model credential: the gateway holds the Bedrock role on the
  nanohype substrate. An optional Bedrock provider calls Bedrock directly
  under the AWS credential chain, for an application off the substrate.
  Neither holds a provider key. Factory-based registry, streaming, token
  counting via js-tiktoken, circuit breakers, OTel metrics, and a gateway
  adapter.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: composable-modules
tags: [llm, providers, model-gateway, bedrock, streaming, typescript]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used as package name and directory'
    prompt: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'LLM provider pack for the Platform ModelGateway and Bedrock'

  - name: DefaultProvider
    type: string
    placeholder: '__DEFAULT_PROVIDER__'
    description: 'Default LLM provider: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), bedrock off the substrate under an assumed IAM role (with IncludeBedrock), mock, or a custom name'
    prompt: 'Default LLM provider'
    default: 'gateway'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR this project deploys under. The gateway provider defaults MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: IncludeBedrock
    type: bool
    placeholder: '__INCLUDE_BEDROCK__'
    description: 'Include the AWS Bedrock provider, which calls Bedrock under the AWS credential chain, for an application off the substrate'

  - name: ProviderCheck
    type: string
    placeholder: '__PROVIDER_CHECK__'
    description: 'Derived from DefaultProvider and IncludeBedrock, and takes no value of its own. It fails the scaffold when DefaultProvider names a provider the project leaves out, which would otherwise fail at the first model call'
    derived: true
    default: '${DefaultProvider}:${IncludeBedrock}'
    validation:
      pattern: '(?!bedrock:false$).*'
      message: 'DefaultProvider bedrock needs IncludeBedrock=true; on the nanohype substrate DefaultProvider is gateway'

conditionals:
  - path: 'src/llm-providers/providers/bedrock.ts'
    when: IncludeBedrock
  - path: 'src/llm-providers/__tests__/bedrock-request.test.ts'
    when: IncludeBedrock

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [ts-service, agentic-loop, rag-pipeline, module-llm-gateway, module-llm-observability]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for the LLM providers module'
    optional: false
