apiVersion: nanohype/v1

name: module-llm-providers
displayName: 'Module: LLM Providers'
description: >
  Shared LLM provider pack — the canonical interface for all AI templates.
  Defaults to the gateway provider, which calls the Platform's ModelGateway
  and holds no model credential: the gateway holds the Bedrock role on the
  nanohype substrate. The Anthropic, OpenAI, and Groq key providers are an
  off-substrate opt-in, beside optional Bedrock, Vertex AI, Hugging Face, and
  Ollama providers. Factory-based registry, streaming, token counting via
  js-tiktoken, circuit breakers, OTel metrics, and a gateway adapter.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: composable-modules
tags: [llm, providers, model-gateway, anthropic, openai, groq, streaming, typescript]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used as package name and directory'
    prompt: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'LLM provider pack for the Platform ModelGateway, Bedrock, and more'

  - name: DefaultProvider
    type: string
    placeholder: '__DEFAULT_PROVIDER__'
    description: 'Default LLM provider: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), or off the substrate anthropic, openai or groq (with IncludeKeyProviders), an optional provider, or a custom name'
    prompt: 'Default LLM provider'
    default: 'gateway'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR this project deploys under. The gateway provider defaults MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the anthropic, openai and groq providers, which authenticate with a provider API key. Off the substrate only (a CLI, a desktop app, a local tool), for a provider the intake brief names, with the key read from the environment or the OS keychain'

  - name: IncludeBedrock
    type: bool
    placeholder: '__INCLUDE_BEDROCK__'
    description: 'Include AWS Bedrock provider'

  - name: IncludeVertex
    type: bool
    placeholder: '__INCLUDE_VERTEX__'
    description: 'Include Google Vertex AI provider'

  - name: IncludeHuggingFace
    type: bool
    placeholder: '__INCLUDE_HUGGING_FACE__'
    description: 'Include Hugging Face Inference provider'

  - name: IncludeOllama
    type: bool
    placeholder: '__INCLUDE_OLLAMA__'
    description: 'Include Ollama local inference provider'

  - name: ProviderCheck
    type: string
    placeholder: '__PROVIDER_CHECK__'
    description: 'Derived from DefaultProvider, IncludeKeyProviders, IncludeBedrock, IncludeVertex, IncludeHuggingFace and IncludeOllama; leave it at its default. It fails the scaffold when DefaultProvider names a provider the project leaves out, which would otherwise fail at the first model call'
    prompt: 'Provider check (leave the default)'
    default: '${DefaultProvider}:${IncludeKeyProviders}:${IncludeBedrock}:${IncludeVertex}:${IncludeHuggingFace}:${IncludeOllama}'
    validation:
      pattern: '(?!(?:anthropic|openai|groq):false:)(?!bedrock:[^:]*:false:)(?!vertex:(?:[^:]*:){2}false:)(?!huggingface:(?:[^:]*:){3}false:)(?!ollama:(?:[^:]*:){4}false$).*'
      message: 'DefaultProvider names a provider the project leaves out: anthropic, openai and groq need IncludeKeyProviders=true, bedrock IncludeBedrock, vertex IncludeVertex, huggingface IncludeHuggingFace and ollama IncludeOllama; on the nanohype substrate DefaultProvider is gateway'

conditionals:
  - path: 'src/llm-providers/providers/anthropic.ts'
    when: IncludeKeyProviders
  - path: 'src/llm-providers/providers/openai.ts'
    when: IncludeKeyProviders
  - path: 'src/llm-providers/providers/groq.ts'
    when: IncludeKeyProviders
  - path: 'src/llm-providers/__tests__/anthropic-request.test.ts'
    when: IncludeKeyProviders
  - path: 'src/llm-providers/__tests__/chat-completions-request.test.ts'
    when: IncludeKeyProviders
  - path: 'src/llm-providers/__tests__/provider-streams.test.ts'
    when: IncludeKeyProviders
  - path: 'src/llm-providers/providers/bedrock.ts'
    when: IncludeBedrock
  - path: 'src/llm-providers/__tests__/bedrock-request.test.ts'
    when: IncludeBedrock
  - path: 'src/llm-providers/providers/vertex.ts'
    when: IncludeVertex
  - path: 'src/llm-providers/__tests__/vertex-request.test.ts'
    when: IncludeVertex
  - path: 'src/llm-providers/providers/huggingface.ts'
    when: IncludeHuggingFace
  - path: 'src/llm-providers/__tests__/huggingface-request.test.ts'
    when: IncludeHuggingFace
  - path: 'src/llm-providers/providers/ollama.ts'
    when: IncludeOllama
  - path: 'src/llm-providers/__tests__/ollama-request.test.ts'
    when: IncludeOllama

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [ts-service, agentic-loop, rag-pipeline, module-llm-gateway, module-llm-observability]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for the LLM providers module'
    optional: false
