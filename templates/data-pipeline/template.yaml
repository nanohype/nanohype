apiVersion: nanohype/v1

name: data-pipeline
displayName: 'Data Pipeline'
description: >
  Scaffolds an ETL pipeline for AI workloads in TypeScript. Implements
  document ingestion from files and web pages, configurable chunking
  strategies (recursive, fixed-size, semantic), embedding generation,
  and output adapters for indexing. No LangChain — every component is
  built from first principles: an embedding call goes to the ModelGateway
  over fetch, or to Bedrock through the AWS SDK. Defaults to
  embeddings through the Platform's ModelGateway (Titan v2), so the
  pipeline holds no model credential, with Bedrock called directly under
  an assumed IAM role as the off-substrate alternate. Supports multiple
  ingest sources (PDF, Markdown, plain text, JSON, CSV, web —
  SSRF-guarded) and output formats (JSONL, console).
  Output is compatible with module-vector-store's VectorDocument shape.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: ai-systems
tags: [typescript, etl, embeddings, pipeline, data, chunking, ai, model-gateway]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used in package.json and directory names'
    prompt: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'Data pipeline for AI workloads'

  - name: EmbeddingProvider
    type: string
    placeholder: '__EMBEDDING_PROVIDER__'
    description: 'Provider for text embeddings: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), or bedrock (Titan v2, called directly under the AWS credential chain, off the substrate)'
    prompt: 'Embedding provider'
    default: 'gateway'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR this project deploys under. The gateway provider defaults MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: ChunkStrategy
    type: string
    placeholder: '__CHUNK_STRATEGY__'
    description: 'Text chunking strategy for splitting documents (e.g. recursive, fixed, semantic)'
    prompt: 'Chunking strategy'
    default: 'recursive'

  - name: IncludeTests
    type: bool
    placeholder: '__INCLUDE_TESTS__'
    description: 'Include vitest test suite with orchestrator, chunking, registry and gateway request tests'
    prompt: 'Include tests?'
    default: true

conditionals:
  - path: 'vitest.config.ts'
    when: IncludeTests
  - path: 'src/pipeline/__tests__/orchestrator.test.ts'
    when: IncludeTests
  - path: 'src/pipeline/__tests__/recursive.test.ts'
    when: IncludeTests
  - path: 'src/pipeline/__tests__/fixed-size.test.ts'
    when: IncludeTests
  - path: 'src/pipeline/__tests__/registry.test.ts'
    when: IncludeTests
  - path: 'src/pipeline/__tests__/gateway.test.ts'
    when: IncludeTests
  - path: 'src/pipeline/__tests__/semantic.test.ts'
    when: IncludeTests
  - path: 'src/pipeline/__tests__/eval-cases.test.ts'
    when: IncludeTests
  - path: 'src/pipeline/__tests__/eval-assertions.test.ts'
    when: IncludeTests

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [module-vector-store, rag-pipeline, eval-harness]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for TypeScript execution'
    optional: false
