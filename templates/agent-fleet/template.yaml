apiVersion: nanohype/v1

name: agent-fleet
displayName: 'Agent Fleet'
description: >
  Scaffolds the AI-workload composite on top of a Platform tenant.
  Produces an AgentFleet CR (agents.nanohype.dev/v1alpha1) declaring one
  or more agents — each a container image bound to a named gateway route
  — behind a KEDA scaler, plus a ModelGateway CR whose routes resolve a
  Bedrock model, fix the wire format callers speak, cap request rate and
  attach a Guardrail. Pairs with k8s-app-tenant — the Platform CR there
  owns the tenant boundary; this composes the AI pieces inside it.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: ai-systems
tags: [kubernetes, bedrock, agents, gateway, keda, nanohype]

variables:
  - name: FleetName
    type: string
    placeholder: '__FLEET_NAME__'
    description: 'Kebab-case fleet name — used as AgentFleet CR name and label selector.'
    prompt: 'Fleet name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Tenant
    type: string
    placeholder: '__TENANT__'
    description: "Owning team — must match the Platform CR's spec.tenant."
    prompt: 'Owning team'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: AppName
    type: string
    placeholder: '__APP_NAME__'
    description: "Companion Platform tenant name (matches k8s-app-tenant's AppName)."
    prompt: 'Platform tenant app name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: ModelFamily
    type: string
    placeholder: '__MODEL_FAMILY__'
    description: 'Bedrock model family for the ModelGateway route. One of: anthropic, meta, mistral, cohere, amazon-titan, amazon-nova, stability.'
    prompt: 'Model family'
    default: 'anthropic'
    validation:
      pattern: '^(anthropic|meta|mistral|cohere|amazon-titan|amazon-nova|stability)$'
      message: 'Must be a Bedrock model family the operator accepts'

  - name: ModelId
    type: string
    placeholder: '__MODEL_ID__'
    description: 'Bedrock inference-profile ID, or a foundation-model ID for a family that still offers on-demand invoke. The current Claude family is inference-profile-only, so it needs the geo prefix.'
    prompt: 'Bedrock model or inference-profile ID'
    default: 'us.anthropic.claude-sonnet-5'

  - name: RouteName
    type: string
    placeholder: '__ROUTE_NAME__'
    description: 'ModelGateway route name. Referenced by each AgentFleet.spec.agents[].modelRoute.'
    prompt: 'Model route name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: AgentImage
    type: string
    placeholder: '__AGENT_IMAGE__'
    description: 'Container image the agent runs. The operator runs it as a Deployment, so the agent framework is whatever the image carries.'
    prompt: 'Agent container image'
    required: true

conditionals: []

composition:
  pairsWith: [k8s-app-tenant, agentic-loop, mcp-server-ts, mcp-server-python]
  nestsInside: [monorepo]

prerequisites:
  - name: kubectl
    version: '>=1.28'
    purpose: 'Apply the AgentFleet and ModelGateway CRs during initial setup'
    optional: false

hooks: {}
