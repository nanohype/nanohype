# ModelGateway — the routes the fleet's agents call, and the models behind them.
# Apply BEFORE the AgentFleet: each agent's spec.agents[].modelRoute references a
# route name declared here. Owned by the Platform named in spec.platformRef.
#
# The operator renders these into an Envoy AI Gateway route set — a Gateway, an
# AIGatewayRoute holding every rule, an AIServiceBackend per model and the
# policies that carry credentials and rate limits. It resolves the Bedrock model
# (optionally via a cross-region inference profile), attaches the guardrail, and
# publishes each route's resolved wire format and base URL on status.routes, so a
# caller reads the contract instead of assuming it.

apiVersion: agents.nanohype.dev/v1alpha1
kind: ModelGateway
metadata:
  name: __APP_NAME__-gateway
  namespace: tenants-__TENANT__
spec:
  # The owning Platform (rendered by k8s-app-tenant). Must already be Ready.
  platformRef:
    name: __APP_NAME__

  routes:
    - name: __ROUTE_NAME__
      # modelFamily ∈ anthropic | meta | mistral | cohere | amazon-titan |
      # amazon-nova | stability
      modelFamily: __MODEL_FAMILY__
      modelId: __MODEL_ID__

      # The wire format callers speak to this route, and therefore which base URL
      # they use — the gateway serves each format under its own endpoint prefix.
      # Left unset it is derived from the model: an anthropic-family route serves
      # Anthropic, everything else serves OpenAI. Set it explicitly to pin the
      # format across a model change, so repointing this route at an open-weight
      # model is a CR edit and the app is untouched.
      # api: Anthropic

      # Redundant here: modelId accepts an inference-profile ID directly and the
      # default above is already the us.* profile, which is what the current
      # Claude family requires — Bedrock reports
      # inferenceTypesSupported: [INFERENCE_PROFILE] for all of it, so there is no
      # home region to pin to and a bare anthropic.* ID is refused. Set this only
      # to route a bare foundation-model ID (an older model, or a non-Anthropic
      # family) through a profile without changing modelId; it overrides modelId
      # when non-empty.
      crossRegionProfile: ""

      # Requests-per-minute cap enforced at the gateway — defends downstream
      # Bedrock quota. Omit or set 0 to disable.
      rateLimit: 60

      # Per-route Bedrock Guardrail override (by name; provisioned in
      # landing-zone). Falls back to spec.defaultGuardrailRef when unset.
      # guardrailRef:
      #   name: <guardrail-name>

  # Applies to any route that does not set its own guardrailRef.
  # defaultGuardrailRef:
  #   name: <guardrail-name>
