# AgentFleet — one Deployment per agent, behind a KEDA scaler.
# Apply AFTER the Platform CR (from k8s-app-tenant) and the ModelGateway
# (modelgateway.yaml in this directory) are Ready. Ownership, namespace, and the
# Pod Identity association come from the Platform via spec.platformRef — the
# AgentFleet carries no tenant or identity of its own.
#
# The operator reconciles, per fleet:
#   - a Deployment for each spec.agents[] entry, running that entry's image
#   - a KEDA ScaledObject from spec.scaling (SQS-depth trigger when queueUrl is
#     set, CPU-utilization otherwise)
#   - a per-fleet NetworkPolicy
#
# The agent framework is whatever the image carries. The platform's contract is
# the route: an agent is given a base URL and a wire format, and anything that
# speaks that format is a valid agent.

apiVersion: agents.nanohype.dev/v1alpha1
kind: AgentFleet
metadata:
  name: __FLEET_NAME__
  namespace: tenants-__TENANT__
spec:
  # The owning Platform (rendered by k8s-app-tenant). Must already be Ready.
  platformRef:
    name: __APP_NAME__

  agents:
    # Each entry becomes one Deployment. modelRoute must name a route declared
    # on the ModelGateway; the operator resolves that route and publishes its
    # endpoint and wire format on the gateway's status. Add more entries as the
    # fleet's persona structure grows.
    - name: __FLEET_NAME__-primary
      image: __AGENT_IMAGE__
      modelRoute: __ROUTE_NAME__
      systemPrompt: |
        You are __FLEET_NAME__-primary. Replace this with the agent's
        instructions. Keep the static prefix large and stable so Bedrock
        prompt caching amortizes; append any per-request context at the end.
      # replicas is the floor; KEDA owns the count while scaling is enabled.
      # replicas: 1
      #
      # resources are the agent container's requests and limits:
      # resources:
      #   requests: { cpu: 250m, memory: 512Mi }
      #   limits:   { cpu: "1",  memory: 2Gi }

  scaling:
    enabled: true
    min: 1
    max: 10
    # SQS depth-based scaling: uncomment queueUrl with the fleet's queue and
    # tune queueDepthTrigger. Without queueUrl the operator emits a
    # CPU-utilization trigger. The tenant role needs sqs:GetQueueAttributes on
    # the queue, which it has when the queue is declared in the Platform's
    # spec.datastores.
    queueDepthTrigger: 10
    # queueUrl: https://sqs.us-east-1.amazonaws.com/000000000000/__FLEET_NAME__
