apiVersion: nanohype/v1

name: agent-orchestrator
displayName: 'Agent Orchestrator'
description: >
  Multi-agent orchestrator that decomposes tasks via an LLM-powered
  planner agent, routes subtasks to specialized agents based on
  capability matching, and aggregates results. Agents communicate
  through a shared context with namespacing and a handoff protocol
  that creates an audit trail of agent-to-agent transitions. Reasons
  through the Platform's ModelGateway and holds no model credential, with
  Anthropic and OpenAI key providers as an off-substrate opt-in.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: ai-systems
tags: [typescript, agent, orchestrator, multi-agent, llm, ai, model-gateway]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used in package.json and directory'
    prompt: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'Multi-agent orchestrator'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider for orchestration reasoning: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), or off the substrate anthropic or openai with IncludeKeyProviders'
    prompt: 'LLM provider'
    default: 'gateway'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR this project deploys under. The gateway provider defaults MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: IncludeTests
    type: bool
    placeholder: '__INCLUDE_TESTS__'
    description: 'Include the test suite'
    prompt: 'Include tests?'
    default: true

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the anthropic and openai providers, which authenticate with a provider API key. Off the substrate only (a CLI, a desktop app, a local tool), for a provider the intake brief names, with the key read from the environment or the OS keychain'
    prompt: 'Include the API-key providers (off the substrate only)?'
    default: false

  - name: ProviderCheck
    type: string
    placeholder: '__PROVIDER_CHECK__'
    description: 'Derived from LlmProvider and IncludeKeyProviders, and takes no value of its own. It fails the scaffold when LlmProvider names a provider the project leaves out, which would otherwise fail at the first model call'
    derived: true
    default: '${LlmProvider}:${IncludeKeyProviders}'
    validation:
      pattern: '(?!(?:anthropic|openai):false$).*'
      message: 'LlmProvider anthropic and openai authenticate with a provider API key, and the project carries them only with IncludeKeyProviders=true; on the nanohype substrate LlmProvider is gateway'

conditionals:
  - path: 'src/orchestrator/providers/anthropic.ts'
    when: IncludeKeyProviders
  - path: 'src/orchestrator/providers/openai.ts'
    when: IncludeKeyProviders
  - path: 'vitest.config.ts'
    when: IncludeTests
  - path: 'src/orchestrator/__tests__/orchestrator.test.ts'
    when: IncludeTests
  - path: 'src/orchestrator/__tests__/routing.test.ts'
    when: IncludeTests
  - path: 'src/orchestrator/__tests__/context.test.ts'
    when: IncludeTests
  - path: 'src/orchestrator/resilience/__tests__/circuit-breaker.test.ts'
    when: IncludeTests
  - path: 'src/orchestrator/__tests__/eval-cases.test.ts'
    when: IncludeTests
  - path: 'src/orchestrator/__tests__/gateway.test.ts'
    when: IncludeTests

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [agentic-loop, mcp-server-ts, rag-pipeline]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for TypeScript execution'
    optional: false
