apiVersion: nanohype/v1

name: module-llm-gateway
displayName: 'Module: LLM Gateway'
description: >
  Unified LLM gateway with pluggable routing strategies, response caching,
  and cost tracking. Defaults to the gateway provider, which calls the
  Platform's ModelGateway and holds no model credential: the gateway holds
  the Bedrock role on the nanohype substrate. Ships a direct Bedrock
  provider for use off the substrate (Converse + prompt caching, AWS
  credential chain), gateway-level provider fallback, six routing strategies
  (static, round-robin, latency, cost, adaptive, linucb), three caching
  modes (hash, sliding-TTL, none), token counting via js-tiktoken, and cost
  anomaly detection using z-score analysis.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: composable-modules
tags: [llm, gateway, model-gateway, routing, caching, cost-tracking, typescript]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used as package name and directory'
    prompt: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'Unified LLM gateway with routing, fallback, and cost tracking'

  - name: DefaultProvider
    type: string
    placeholder: '__DEFAULT_PROVIDER__'
    description: 'Default LLM provider: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), bedrock off the substrate under an assumed IAM role, mock, or a custom name'
    prompt: 'Default LLM provider'
    default: 'gateway'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR this project deploys under. The gateway provider defaults MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: RoutingStrategy
    type: string
    placeholder: '__ROUTING_STRATEGY__'
    description: 'Default routing strategy (static, round-robin, latency, cost, adaptive)'
    prompt: 'Routing strategy'
    default: 'adaptive'

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [ts-service, agentic-loop, rag-pipeline]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for the LLM gateway module'
    optional: false
