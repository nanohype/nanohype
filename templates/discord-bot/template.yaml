apiVersion: nanohype/v1

name: discord-bot
displayName: 'Discord Bot'
description: >
  Scaffolds a TypeScript Discord bot using discord.js v14 with
  GatewayIntentBits for guilds, messages, and message content. Includes
  slash command registration and handling, a messageCreate handler with
  AI-powered responses, a pluggable LLM provider registry that defaults to
  the Platform's ModelGateway and holds no model credential (Anthropic and
  OpenAI key providers are an off-substrate opt-in), and embed-based rich
  formatting for structured AI output.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: applications
tags: [typescript, discord, bot, ai, chatbot, model-gateway]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used as package name and directory'
    prompt: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'A Discord bot with AI'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'Default LLM provider: gateway (the Platform ModelGateway, the only route to a model on the nanohype substrate), or off the substrate anthropic or openai with IncludeKeyProviders'
    prompt: 'LLM provider'
    default: 'gateway'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR this project deploys under. The gateway provider defaults MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: IncludeTests
    type: bool
    placeholder: '__INCLUDE_TESTS__'
    description: 'Include test files with vitest'
    prompt: 'Include tests?'
    default: true

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the anthropic and openai providers, which authenticate with a provider API key. Off the substrate only (a CLI, a desktop app, a local tool), for a provider the intake brief names, with the key read from the environment or the OS keychain'
    prompt: 'Include the API-key providers (off the substrate only)?'
    default: false

conditionals:
  - path: 'src/providers/anthropic.ts'
    when: IncludeKeyProviders
  - path: 'src/providers/openai.ts'
    when: IncludeKeyProviders
  - path: 'vitest.config.ts'
    when: IncludeTests
  - path: 'src/__tests__/commands.test.ts'
    when: IncludeTests
  - path: 'src/providers/__tests__/gateway.test.ts'
    when: IncludeTests

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [module-queue-ts, module-database-ts, agentic-loop]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for the Discord bot'
    optional: false
