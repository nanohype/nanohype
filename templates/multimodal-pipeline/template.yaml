apiVersion: nanohype/v1

name: multimodal-pipeline
displayName: 'Multimodal Pipeline'
description: >
  Scaffolds a multimodal processing pipeline in TypeScript. Accepts image,
  audio, and video inputs, detects modality automatically, routes each input
  through a modality-specific processor, sends the result to a vision-capable
  LLM through the Platform's ModelGateway, which holds the model credential
  so the pipeline holds none, and returns structured output with
  Zod-validated schemas. Anthropic and OpenAI key providers are an
  off-substrate opt-in. No heavy frameworks — all
  components are built from first principles using provider SDKs directly.
  Processors and LLM providers use a self-registering registry pattern for
  easy extension.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: ai-systems
tags: [typescript, multimodal, vision, audio, video, llm, ai, structured-output, model-gateway]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used in package.json and directory names'
    prompt: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'A multimodal processing pipeline'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider for multimodal analysis: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), or off the substrate anthropic or openai with IncludeKeyProviders'
    prompt: 'LLM provider'
    default: 'gateway'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR this project deploys under. The gateway provider defaults MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: IncludeAudio
    type: bool
    placeholder: '__INCLUDE_AUDIO__'
    description: 'Include audio processing support (whisper transcription + LLM analysis). Transcription calls the OpenAI API with OPENAI_API_KEY and the ModelGateway serves no transcription route, so this is off the substrate only, for a pipeline whose intake brief names OpenAI, with the key read from the environment or the OS keychain'
    prompt: 'Include audio processing (off the substrate only)?'
    default: false

  - name: IncludeVideo
    type: bool
    placeholder: '__INCLUDE_VIDEO__'
    description: 'Include video processing support (frame extraction + LLM analysis)'
    prompt: 'Include video processing?'
    default: false

  - name: IncludeTests
    type: bool
    placeholder: '__INCLUDE_TESTS__'
    description: 'Include the vitest config and the pipeline and image processor suites, with the gateway request suite and, with IncludeKeyProviders, the anthropic and openai request suites'
    prompt: 'Include tests?'
    default: true

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the anthropic and openai providers, which authenticate with a provider API key. Off the substrate only (a CLI, a desktop app, a local tool), for a provider the intake brief names, with the key read from the environment or the OS keychain'
    prompt: 'Include the API-key providers (off the substrate only)?'
    default: false

  - name: ProviderCheck
    type: string
    placeholder: '__PROVIDER_CHECK__'
    description: 'Derived from LlmProvider and IncludeKeyProviders, and takes no value of its own. It fails the scaffold when LlmProvider names a provider the project leaves out, which would otherwise fail at the first model call'
    derived: true
    default: '${LlmProvider}:${IncludeKeyProviders}'
    validation:
      pattern: '(?!(?:anthropic|openai):false$).*'
      message: 'LlmProvider anthropic and openai authenticate with a provider API key, and the project carries them only with IncludeKeyProviders=true; on the nanohype substrate LlmProvider is gateway'

conditionals:
  - path: 'src/providers/anthropic.ts'
    when: IncludeKeyProviders
  - path: 'src/providers/openai.ts'
    when: IncludeKeyProviders
  - path: 'src/processors/audio.ts'
    when: IncludeAudio
  - path: 'src/processors/video.ts'
    when: IncludeVideo
  - path: 'vitest.config.ts'
    when: IncludeTests
  - path: 'src/__tests__/pipeline.test.ts'
    when: IncludeTests
  - path: 'src/__tests__/image.test.ts'
    when: IncludeTests
  - path: 'src/__tests__/gateway.test.ts'
    when: IncludeTests
  - path: 'src/__tests__/anthropic-request.test.ts'
    when: IncludeTests && IncludeKeyProviders
  - path: 'src/__tests__/openai-request.test.ts'
    when: IncludeTests && IncludeKeyProviders

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [agentic-loop, rag-pipeline, eval-harness]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for TypeScript execution'
    optional: false
