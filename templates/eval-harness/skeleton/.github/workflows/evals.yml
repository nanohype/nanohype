name: Eval Suite

on:
  pull_request:
    branches: [main]

# id-token: write lets the job request its GitHub OIDC token, which the
# bedrock provider's role assumption federates. GitHub issues none to a pull
# request from a fork, so a fork's run reaches no model.
permissions:
  contents: read
  id-token: write

jobs:
  run-evals:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: __LLM_PROVIDER__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The bedrock provider calls Bedrock under the role the repository
      # variable EVAL_ROLE_ARN names. The role trusts the GitHub OIDC
      # provider for this repository's pull_request subject and grants
      # bedrock:InvokeModel on the inference profiles the suites grade and the
      # foundation models they route to. The job holds the role's session
      # credentials only, never a long-lived key.
      - name: Assume the eval role
        if: env.LLM_PROVIDER == 'bedrock'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.EVAL_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run evaluations
        run: npm run eval:ci -- --provider "$LLM_PROVIDER" > eval-results.json

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-results
          path: eval-results.json
          retention-days: 30
