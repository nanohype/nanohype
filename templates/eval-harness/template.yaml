apiVersion: nanohype/v1

name: eval-harness
displayName: 'Eval Harness'
description: >
  Scaffolds a standalone TypeScript evaluation framework for testing LLM
  outputs. Loads eval suites from YAML files, runs each case against an
  LLM provider, applies composable assertions (string matching, regex,
  JSON schema, token limits, custom predicates), and reports results to
  the console or as structured JSON. Works with any LLM system —
  Anthropic and OpenAI providers included out of the box.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: ai-systems
tags: [typescript, eval, testing, llm, ai, model-gateway]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used in package.json and directory'
    prompt: 'Project name'
    default: 'my-evals'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'LLM evaluation harness'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'Default LLM provider name: anthropic or openai for a run outside the cluster (a CI runner, a workstation), with a key the intake brief names; gateway for a run inside it, through the Platform ModelGateway with no credential; or any custom registered provider'
    prompt: 'LLM provider'
    default: 'anthropic'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR whose ModelGateway routes a run inside the cluster grades. The gateway provider defaults MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: IncludeCi
    type: bool
    placeholder: '__INCLUDE_CI__'
    description: 'Include GitHub Actions CI workflow for automated eval runs'
    prompt: 'Include CI workflow?'
    default: true

conditionals:
  - path: '.github/workflows/evals.yml'
    when: IncludeCi

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [agentic-loop, rag-pipeline, mcp-server-ts]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for TypeScript execution'
    optional: false
