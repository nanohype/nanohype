apiVersion: nanohype/v1

name: vscode-ext
displayName: 'VS Code Extension (TypeScript + esbuild)'
description: >
  Scaffolds a VS Code extension with TypeScript and esbuild bundling.
  Optionally includes a React-based webview panel that communicates with
  the extension host via postMessage, and an AI integration layer whose
  Bedrock provider signs with an AWS profile through the AWS SDK's
  credential chain and holds no provider key, using the shared registry
  pattern.
  Uses esbuild for fast builds and supports the standard VS Code
  extension development workflow.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: applications
tags: [vscode, extension, typescript, ai, editor]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used as package name and directory'
    prompt: 'Project name'
    default: 'my-vscode-extension'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: ExtensionName
    type: string
    placeholder: '__EXTENSION_NAME__'
    description: 'Human-readable extension name displayed in VS Code'
    prompt: 'Extension display name'
    default: 'My Extension'
    required: true

  - name: Publisher
    type: string
    placeholder: '__PUBLISHER__'
    description: 'VS Code marketplace publisher ID'
    prompt: 'Publisher ID'
    required: true
    validation:
      pattern: '^[a-zA-Z][a-zA-Z0-9-]*$'
      message: 'Must start with a letter and contain only letters, numbers, and hyphens'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short extension description for package.json and README'
    prompt: 'Extension description'
    default: 'A VS Code extension'

  - name: ActivationEvent
    type: string
    placeholder: '__ACTIVATION_EVENT__'
    description: 'VS Code activation event trigger'
    prompt: 'Activation event'
    default: 'onStartupFinished'

  - name: IncludeWebview
    type: bool
    placeholder: '__INCLUDE_WEBVIEW__'
    description: 'Include a React-based webview chat panel. Requires IncludeAi, which supplies the client that answers a turn.'
    prompt: 'Include webview panel?'
    default: true

  - name: IncludeAi
    type: bool
    placeholder: '__INCLUDE_AI__'
    description: 'Include AI integration with a Bedrock provider that signs with an AWS profile'
    prompt: 'Include AI integration?'
    default: true

conditionals:
  # The panel is a chat surface and nothing else, so it needs a client to
  # answer a turn. One condition covers the whole webview — the panel, the
  # React app, the message protocol between them, the command that opens it,
  # the session that reads the provider settings, and their suites — because a
  # file here importing one gated on a weaker condition renders a scaffold that
  # cannot build.
  - path: 'src/webview/panel.ts'
    when: IncludeWebview && IncludeAi
  - path: 'src/webview/protocol.ts'
    when: IncludeWebview && IncludeAi
  - path: 'src/commands/webview.ts'
    when: IncludeWebview && IncludeAi
  - path: 'src/ai/chat-session.ts'
    when: IncludeWebview && IncludeAi
  - path: 'src/__tests__/webview.test.ts'
    when: IncludeWebview && IncludeAi
  - path: 'src/__tests__/webview-command.test.ts'
    when: IncludeWebview && IncludeAi
  - path: 'src/__tests__/webview-app.test.tsx'
    when: IncludeWebview && IncludeAi
  - path: 'src/webview/app/index.html'
    when: IncludeWebview && IncludeAi
  - path: 'src/webview/app/index.tsx'
    when: IncludeWebview && IncludeAi
  - path: 'src/webview/app/App.tsx'
    when: IncludeWebview && IncludeAi
  - path: 'src/ai/providers/types.ts'
    when: IncludeAi
  - path: 'src/ai/providers/registry.ts'
    when: IncludeAi
  - path: 'src/ai/providers/bedrock.ts'
    when: IncludeAi
  - path: 'src/ai/providers/index.ts'
    when: IncludeAi
  - path: 'src/ai/client.ts'
    when: IncludeAi
  # The provider suites import the registry, the provider types and the
  # bedrock provider, so they leave with them. Left behind they are test files
  # whose imports resolve to nothing, and the scaffold fails `tsc` on its
  # first commit.
  - path: 'src/__tests__/providers.test.ts'
    when: IncludeAi
  - path: 'src/__tests__/bedrock.test.ts'
    when: IncludeAi

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [mcp-server-ts, prompt-library]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for building and bundling the extension'
    optional: false
  - name: vsce
    purpose: 'VS Code Extension CLI for packaging and publishing'
    optional: true
