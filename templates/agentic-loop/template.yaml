apiVersion: nanohype/v1

name: agentic-loop
displayName: 'Agentic Loop'
description: >
  Scaffolds a TypeScript agentic loop that sends messages to an LLM,
  detects tool-call requests in the response, executes them via a typed
  tool registry, appends results, and repeats until the model stops
  calling tools or an iteration limit is reached. Calls the Platform's
  ModelGateway with tool use and holds no model credential, with Anthropic
  and OpenAI key providers as an off-substrate opt-in, an optional
  conversation memory subsystem
  with token-aware truncation, and an optional eval harness for
  assertion-based testing against fixture files.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: ai-systems
tags: [typescript, agent, llm, tools, agentic, ai, model-gateway]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used in package.json and directory'
    prompt: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'An agentic loop powered by LLM tool-calling'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider for the agent: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), or off the substrate anthropic or openai with IncludeKeyProviders'
    prompt: 'LLM provider'
    default: 'gateway'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR this project deploys under. The gateway provider defaults MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: IncludeMemory
    type: bool
    placeholder: '__INCLUDE_MEMORY__'
    description: 'Include the conversation memory subsystem with token-aware truncation'
    prompt: 'Include memory subsystem?'
    default: true

  - name: IncludeEval
    type: bool
    placeholder: '__INCLUDE_EVAL__'
    description: 'Include the eval harness for assertion-based agent testing'
    prompt: 'Include eval harness?'
    default: true

  - name: MaxIterations
    type: int
    placeholder: '__MAX_ITERATIONS__'
    description: 'Maximum number of tool-calling loop iterations before the agent stops'
    prompt: 'Max loop iterations'
    default: 10

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the anthropic and openai providers, which authenticate with a provider API key. Off the substrate only (a CLI, a desktop app, a local tool), for a provider the intake brief names, with the key read from the environment or the OS keychain'
    prompt: 'Include the API-key providers (off the substrate only)?'
    default: false

  - name: ProviderCheck
    type: string
    placeholder: '__PROVIDER_CHECK__'
    description: 'Derived from LlmProvider and IncludeKeyProviders; leave it at its default. It fails the scaffold when LlmProvider names a provider the project leaves out, which would otherwise fail at the first model call'
    prompt: 'Provider check (leave the default)'
    default: '${LlmProvider}:${IncludeKeyProviders}'
    validation:
      pattern: '(?!(?:anthropic|openai):false$).*'
      message: 'LlmProvider anthropic and openai authenticate with a provider API key, and the project carries them only with IncludeKeyProviders=true; on the nanohype substrate LlmProvider is gateway'

conditionals:
  - path: 'src/providers/anthropic.ts'
    when: IncludeKeyProviders
  - path: 'src/providers/openai.ts'
    when: IncludeKeyProviders
  - path: 'src/memory/store.ts'
    when: IncludeMemory
  - path: 'src/memory/context.ts'
    when: IncludeMemory
  - path: 'src/memory/conversation.ts'
    when: IncludeMemory
  - path: 'src/eval/runner.ts'
    when: IncludeEval
  - path: 'src/eval/assertions.ts'
    when: IncludeEval
  - path: 'src/eval/cases.ts'
    when: IncludeEval
  - path: 'src/eval/cases/answers-with-the-tool-result.json'
    when: IncludeEval
  - path: 'src/eval/cases/refuses-instructions-inside-tool-output.json'
    when: IncludeEval
  - path: 'src/eval/cases/keeps-the-system-role-under-contradiction.json'
    when: IncludeEval
  - path: 'src/__tests__/eval-cases.test.ts'
    when: IncludeEval
  - path: 'src/__tests__/eval-runner.test.ts'
    when: IncludeEval

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [mcp-server-ts, eval-harness, rag-pipeline]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for TypeScript execution'
    optional: false
