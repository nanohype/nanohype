name: Eval Gate

on:
  pull_request:
    branches: [main]

# id-token: write lets the job request its GitHub OIDC token, which the
# bedrock provider's role assumption federates. GitHub issues none to a pull
# request from a fork, so a fork's run reaches no model.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: __LLM_PROVIDER__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The bedrock provider calls Bedrock under the role the repository
      # variable EVAL_ROLE_ARN names. The role trusts the GitHub OIDC
      # provider for this repository's pull_request subject and grants
      # bedrock:InvokeModel on the inference profiles the suites grade and on
      # the foundation model each routes to, in every one of the profile's
      # destination regions. The job holds the role's session credentials
      # only, never a long-lived key.
      - name: Assume the eval role
        if: env.LLM_PROVIDER == 'bedrock'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.EVAL_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run eval suites
        id: eval
        run: npx tsx src/ci-eval/index.ts run --json > eval-output.json

      - name: Compare against baseline
        id: compare
        run: npx tsx src/ci-eval/index.ts compare --results eval-output.json --format markdown > eval-comment.md

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY=$(cat eval-comment.md)
          MARKER="<!-- eval-gate-report -->"
          FULL_BODY="${MARKER}
          ${COMMENT_BODY}"

          # Try to update existing comment, otherwise create new one
          EXISTING=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)

          if [ -n "$EXISTING" ]; then
            gh api repos/${{ github.repository }}/issues/comments/$EXISTING \
              -X PATCH -f body="$FULL_BODY"
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "$FULL_BODY"
          fi

      - name: Check regression threshold
        run: npx tsx src/ci-eval/index.ts compare --results eval-output.json --fail-on-regression

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-results
          path: eval-output.json
          retention-days: 30
