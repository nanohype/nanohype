apiVersion: nanohype/v1

name: ci-eval
displayName: 'CI Eval Pipeline'
description: >
  GitHub Actions workflow for eval-gated deployments. Runs LLM evaluation
  suites on every pull request, compares scores against a stored baseline,
  posts a markdown report as a PR comment, and fails the check if any
  suite regresses beyond a configurable threshold. Ships with a CLI for
  local runs, baseline management, and score comparison.
version: '0.1.0'
license: Apache-2.0
persona: [engineering]
category: ai-systems
tags: [typescript, ci, eval, github-actions, llm, ai, model-gateway]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Kebab-case project name, used in package.json and directory'
    prompt: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short project description for package.json and README'
    prompt: 'Project description'
    default: 'CI pipeline for eval-gated deployments'

  - name: EvalPath
    type: string
    placeholder: '__EVAL_PATH__'
    description: 'Directory containing YAML eval suite files'
    prompt: 'Eval suites directory'
    default: 'evals'

  - name: RegressionThreshold
    type: string
    placeholder: '__REGRESSION_THRESHOLD__'
    description: 'Maximum allowed score regression before failing the check (0.0–1.0)'
    prompt: 'Regression threshold'
    default: '0.05'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'Default LLM provider name: anthropic or openai for a run outside the cluster (a CI runner, a workstation), with a key the intake brief names; gateway for a run inside it, through the Platform ModelGateway with no credential; or any custom registered provider'
    prompt: 'LLM provider'
    default: 'anthropic'

  - name: PlatformName
    type: string
    placeholder: '__PLATFORM_NAME__'
    description: 'Name of the Platform CR whose ModelGateway routes a run inside the cluster grades. The gateway provider defaults MODEL_GATEWAY_ENDPOINT to the Service the eks-agent-platform operator creates for it, <PlatformName>-gateway in namespace tenants-<PlatformName>'
    prompt: 'Platform name'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]{0,54}$'
      message: 'Must be lowercase kebab-case of at most 55 characters, so <PlatformName>-gateway and tenants-<PlatformName> are DNS labels'

  - name: IncludeTests
    type: bool
    placeholder: '__INCLUDE_TESTS__'
    description: 'Include unit tests for baseline, reporter, and runner'
    prompt: 'Include tests?'
    default: true

conditionals:
  - path: 'vitest.config.ts'
    when: IncludeTests
  - path: 'src/__tests__/baseline.test.ts'
    when: IncludeTests
  - path: 'src/__tests__/reporter.test.ts'
    when: IncludeTests
  - path: 'src/__tests__/runner.test.ts'
    when: IncludeTests

hooks:
  post:
    - name: install-dependencies
      description: 'Install npm dependencies'
      run: 'npm install'
      workdir: '.'

composition:
  pairsWith: [eval-harness, ts-service, agentic-loop]
  nestsInside: [monorepo]

prerequisites:
  - name: node
    version: '>=26'
    purpose: 'Node.js runtime for TypeScript execution'
    optional: false
  - name: gh
    purpose: 'GitHub CLI for posting PR comments'
    optional: true
