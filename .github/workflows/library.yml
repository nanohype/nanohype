name: Runtime Library

on:
  push:
    branches: [main]
    paths: ['library/runtime/**']
  pull_request:
    paths: ['library/runtime/**']

permissions:
  contents: read

jobs:
  # Supply-chain gate. osv-scanner checks the committed lockfiles against the
  # OSV database and exits non-zero on a known vulnerability. Pinned to an exact
  # version (its behaviour can shift in a patch).
  audit:
    name: audit (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: audit (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --no-resolve
            --recursive
            ./

  typecheck-and-test:
    name: Typecheck and test runtime library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library/runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: library/runtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
