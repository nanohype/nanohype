name: Runtime Library

on:
  push:
    branches: [main]
    paths: ['library/runtime/**']
  pull_request:
    paths: ['library/runtime/**']

permissions:
  contents: read

jobs:
  # Supply-chain gate. osv-scanner checks the committed lockfiles against the
  # OSV database and exits non-zero on a known vulnerability. Pinned to an exact
  # version (its behaviour can shift in a patch).
  audit:
    name: audit (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: audit (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --no-resolve
            --recursive
            ./

  typecheck-and-test:
    name: Typecheck and test runtime library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library/runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: library/runtime/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Coverage thresholds live in vitest.config.ts, so vitest itself fails the
      # run when one is missed — no separate assertion step.
      - name: Test with coverage floors
        run: npm run test:coverage
