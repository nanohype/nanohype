name: MCP Server

on:
  push:
    branches: [main]
    paths: ['mcp-server/**', 'sdk/**', 'schemas/**', 'library/config/**', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['mcp-server/**', 'sdk/**', 'schemas/**', 'library/config/**', 'package.json', 'package-lock.json']

permissions:
  contents: read

jobs:
  # Supply-chain gate. Replaces `npm audit`, whose npm advisory endpoints are
  # unreliable; osv-scanner checks the committed lockfiles against the OSV
  # database and exits non-zero on a known vulnerability. Pinned to an exact
  # version (its behaviour can shift in a patch).
  #
  # Runs as its own job so a new advisory still blocks the merge but never
  # short-circuits the typecheck/lint/build/test signal below.
  audit:
    name: audit (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: audit (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --no-resolve
            --recursive
            ./

  build-and-test:
    name: Build and test MCP server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      # The MCP server resolves @nanohype/sdk from the registry, the same way a
      # consumer does, so there is no sibling to build first. The consequence is
      # a release ordering: an MCP change that needs a new SDK symbol waits for
      # the SDK release and a bumped range, because CI here proves the published
      # pair works together rather than a locally-linked one that no consumer
      # ever gets.
      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Typecheck
        working-directory: mcp-server
        run: npm run typecheck

      - name: Lint
        working-directory: mcp-server
        run: npm run lint

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Test with coverage floors
        working-directory: mcp-server
        run: npm run test:coverage
