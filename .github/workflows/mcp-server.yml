name: MCP Server

on:
  push:
    branches: [main]
    paths: ['mcp-server/**', 'sdk/**', 'schemas/**', 'library/config/**', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['mcp-server/**', 'sdk/**', 'schemas/**', 'library/config/**', 'package.json', 'package-lock.json']

permissions:
  contents: read

jobs:
  # Supply-chain gate. Replaces `npm audit`, whose npm advisory endpoints are
  # unreliable; osv-scanner checks the committed lockfiles against the OSV
  # database and exits non-zero on a known vulnerability. Pinned to an exact
  # version (its behaviour can shift in a patch).
  #
  # Runs as its own job so a new advisory still blocks the merge but never
  # short-circuits the typecheck/lint/build/test signal below.
  audit:
    name: audit (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: audit (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --no-resolve
            --recursive
            ./

  build-and-test:
    name: Build and test MCP server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json
            mcp-server/package-lock.json

      # The lint config re-exports library/config/eslint.base.mjs, whose
      # imports (@eslint/js, typescript-eslint) resolve from the repo root.
      - name: Install root tooling dependencies
        run: npm ci

      # The MCP server depends on @nanohype/sdk via file:../sdk, so the sibling
      # package must be installed and built before the MCP package resolves it.
      - name: Build the linked SDK
        working-directory: sdk
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Typecheck
        working-directory: mcp-server
        run: npm run typecheck

      - name: Lint
        working-directory: mcp-server
        run: npm run lint

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Test with coverage floors
        working-directory: mcp-server
        run: npm run test:coverage
