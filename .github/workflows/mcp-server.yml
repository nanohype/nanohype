name: MCP Server

on:
  push:
    branches: [main]
    paths: ['mcp-server/**', 'sdk/**', 'schemas/**', 'library/config/**', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['mcp-server/**', 'sdk/**', 'schemas/**', 'library/config/**', 'package.json', 'package-lock.json']

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test MCP server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json
            mcp-server/package-lock.json

      # The lint config re-exports library/config/eslint.base.mjs, whose
      # imports (@eslint/js, typescript-eslint) resolve from the repo root.
      - name: Install root tooling dependencies
        run: npm ci

      # The MCP server depends on @nanohype/sdk via file:../sdk, so the sibling
      # package must be installed and built before the MCP package resolves it.
      - name: Build the linked SDK
        working-directory: sdk
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      - name: Audit dependencies
        working-directory: mcp-server
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck
        working-directory: mcp-server
        run: npm run typecheck

      - name: Lint
        working-directory: mcp-server
        run: npm run lint

      - name: Build
        working-directory: mcp-server
        run: npm run build

      - name: Test with coverage floors
        working-directory: mcp-server
        run: npm run test:coverage
