name: SDK

on:
  push:
    branches: [main]
    paths: ['sdk/**', 'schemas/**', 'library/config/**', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['sdk/**', 'schemas/**', 'library/config/**', 'package.json', 'package-lock.json']

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      # The lint config re-exports library/config/eslint.base.mjs, whose
      # imports (@eslint/js, typescript-eslint) resolve from the repo root.
      - name: Install root tooling dependencies
        working-directory: .
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage floors
        run: npm run test:coverage

  schema-sync:
    name: Verify schema sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Diff schema files
        run: diff schemas/template.schema.json sdk/schemas/template.schema.json
