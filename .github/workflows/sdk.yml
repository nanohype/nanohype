name: SDK

on:
  push:
    branches: [main]
    paths: ['sdk/**', 'schemas/**', 'library/config/**', 'package.json', 'package-lock.json']
  pull_request:
    paths: ['sdk/**', 'schemas/**', 'library/config/**', 'package.json', 'package-lock.json']

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdk/package-lock.json

      # The lint config re-exports library/config/eslint.base.mjs, whose
      # imports (@eslint/js, typescript-eslint) resolve from the repo root.
      - name: Install root tooling dependencies
        working-directory: .
        run: npm ci

      - name: Install dependencies
        run: npm ci

      # Supply-chain gate. Replaces `npm audit`, whose npm advisory endpoints are
      # unreliable; osv-scanner checks the committed lockfiles against the OSV
      # database and exits non-zero on a known vulnerability. Pinned to an exact
      # version (its behaviour can shift in a patch).
      - name: audit (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test with coverage floors
        run: npm run test:coverage

  schema-sync:
    name: Verify schema sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Diff schema files
        run: diff schemas/template.schema.json sdk/schemas/template.schema.json
