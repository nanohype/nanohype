name: Validate Templates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Supply-chain gate. osv-scanner checks the committed lockfiles against the
  # OSV database and exits non-zero on a known vulnerability. Pinned to an exact
  # version (its behaviour can shift in a patch).
  audit:
    name: audit (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: audit (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --no-resolve
            --recursive
            ./

  # .editorconfig declares charset, LF endings, a final newline and no trailing
  # whitespace for every file. Biome covers TS and JSON, so those rules held for
  # part of the tree and were unobserved everywhere else — YAML, Markdown, the
  # template skeletons, shell.
  #
  # This job lives here rather than in a workflow of its own because the gate
  # covers every tracked file, so it has to run on every change, and this is the
  # one workflow with no path filter. A path-filtered editorconfig gate would be
  # unable to observe most of what it checks.
  #
  # Indentation checks stay off: Go answers to gofmt, TS and JSON to biome, and a
  # Makefile needs tabs for its recipes and spaces for the continuation lines
  # inside them — the skeleton Makefiles are correct and would be flagged. This
  # takes the rules nothing else owns.
  editorconfig:
    name: editorconfig
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
      - run: npm run editorconfig

  validate:
    name: Validate template catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install yq
        uses: mikefarah/yq@v4.53.2

      - name: Find and validate templates
        run: |
          failed=0
          templates=$(find templates -name "template.yaml" -mindepth 2 -maxdepth 2 2>/dev/null | sort)

          if [ -z "$templates" ]; then
            echo "No templates found — skipping validation"
            exit 0
          fi

          for yaml in $templates; do
            dir=$(dirname "$yaml")
            echo "──────────────────────────────────────"
            echo "Validating: $dir"
            echo "──────────────────────────────────────"

            if ! ./scripts/validate.sh "$dir"; then
              failed=1
            fi

            echo ""
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more templates failed validation"
            exit 1
          fi

  validate-catalog:
    name: Validate catalog-level checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install yq
        uses: mikefarah/yq@v4.53.2

      # This repository's own source — the SDK, the MCP server, the shared
      # library, and every script under scripts/. `lint:skeletons` below covers
      # the catalog's scaffolding output, which the root config excludes; nothing
      # covered what lints the catalog. So `npm run lint` sat failing on main,
      # which is the same defect the skeleton gate was built for, one level up:
      # a command the contributing docs tell you to run, that no job runs.
      - name: Lint this repository
        run: npm run lint

      - name: Run catalog validation
        run: npm run validate:catalog

      - name: Validate standards manifests
        run: npm run validate:standards

      # A model ID is a plain string, so no compiler, linter or type checker has
      # an opinion about it — a scaffold born on a retired or never-existent ID
      # fails only at the first invocation, in the consumer's project. This
      # checks every ID against the set standards/llm-policy.json names, and
      # rejects a bare Bedrock foundation-model ID in invoke position (the
      # current Claude family is INFERENCE_PROFILE-only, so those are refused).
      - name: Verify model IDs match the LLM policy
        run: npm run validate:model-ids

      - name: Verify catalog is regenerated (no drift)
        run: npm run verify:catalog

      - name: Verify documented commands exist
        run: npm run validate:doc-commands

      # A template README is a step an agent scaffolding from it will carry out,
      # not a note to a reader. The agent-fleet skeleton told its author to
      # uncomment a block that was not in the file it named — wrong on the day it
      # was written, and later naming a CR kind and a landing-zone component that
      # had both been deleted. Catalog validation and Template Doctor were green
      # throughout: they check catalog health and skeleton structure, and nothing
      # read whether a sentence described the file beside it.
      - name: Verify uncomment instructions resolve
        run: npm run validate:uncomment-instructions

      # SLOPolicy builds its PromQL from `sli.metric` plus the suffix `sli.type`
      # implies — it never takes a raw query — so a template's series either fit
      # that shape or the tenant cannot have an objective at all, and the failure
      # is silent: the query resolves to nothing and the policy reports NoData
      # while AgentSLOEvaluationStale pages on a metric that was never there.
      #
      # Two templates were one character from working. ts-service emitted
      # `http_errors_total` beside `http_request_total` — singular — and its own
      # comment called the first "the 'errors' of RED". data-pipeline had the
      # errors half and named its denominator `pipeline_documents_processed`.
      - name: Verify SLI metric names
        run: npm run validate:sli-metric-names

      # npm does not rewrite `file:`/`link:` specifiers at publish time, and a
      # package that carries one to the registry installs cleanly, omits the
      # dependency, and crashes on the consumer's first import. The development
      # tree resolves the path fine, so lint, typecheck and the test suites all
      # pass on a manifest that is already broken downstream — this is the only
      # step that can see it.
      - name: Verify no local-path deps in publishable packages
        run: npm run validate:publishable-deps

      # A skeleton is what a consumer's project starts as, and the root
      # biome.json excludes templates/*/skeleton — it has to, since each
      # skeleton is scaffolding output with its own root and config. These two
      # steps are what read them: the first asserts every skeleton carries the
      # shared Biome config, the second asserts its code passes it, running the
      # same command from the same directory a consumer would.
      - name: Verify skeletons ship the shared toolchain
        run: npm run validate:skeleton-toolchain

      - name: Lint every skeleton against its own config
        run: npm run lint:skeletons

      - name: Verify vendored library copies are in sync
        run: npm run verify:library

  test-templates:
    name: Test template skeletons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run template tests
        run: |
          failed=0
          tested=0

          # Every package.json under a skeleton, not just the one at its root.
          # A skeleton whose code lives a directory deeper (prompt-library/sdk,
          # monorepo/packages/*) was invisible to a `templates/*/skeleton/`
          # glob, so its suite never ran here — which is how prompt-library
          # shipped a test suite that had been failing outright.
          while IFS= read -r pkg; do
            [ -f "$pkg" ] || continue
            dir=$(dirname "$pkg")

            # Skip if no test script defined
            if ! node -e "const p = require('./$pkg'); if (!p.scripts || !p.scripts.test) process.exit(1);" 2>/dev/null; then
              continue
            fi

            echo "──────────────────────────────────────"
            echo "Testing: $dir"
            echo "──────────────────────────────────────"
            tested=$((tested + 1))

            if ! (cd "$dir" && npm install --ignore-scripts && npm test); then
              echo "FAIL: $dir"
              failed=1
            fi

            echo ""
          done < <(find templates -mindepth 3 -name package.json -not -path '*/node_modules/*' | sort)

          echo "──────────────────────────────────────"
          echo "Templates tested: $tested"
          echo "──────────────────────────────────────"

          if [ "$failed" -ne 0 ]; then
            echo "One or more template tests failed"
            exit 1
          fi
