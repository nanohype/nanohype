name: Validate Templates

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each entry on its own temporary branch. A required
  # check that does not run there never reports, and the queue waits forever —
  # so every workflow publishing a required check has to listen for this event.
  merge_group:

permissions:
  contents: read

jobs:
  # Supply-chain gate. osv-scanner checks the committed lockfiles against the
  # OSV database and exits non-zero on a known vulnerability. Pinned to an exact
  # version (its behaviour can shift in a patch).
  audit:
    name: audit (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: audit (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --no-resolve
            --recursive
            ./

  # .editorconfig declares charset, LF endings, a final newline and no trailing
  # whitespace for every file. Biome covers TS and JSON, so those rules held for
  # part of the tree and were unobserved everywhere else — YAML, Markdown, the
  # template skeletons, shell.
  #
  # This job lives here rather than in a workflow of its own because the gate
  # covers every tracked file, so it has to run on every change, and this is the
  # one workflow with no path filter. A path-filtered editorconfig gate would be
  # unable to observe most of what it checks.
  #
  # Indentation checks stay off: Go answers to gofmt, TS and JSON to biome, and a
  # Makefile needs tabs for its recipes and spaces for the continuation lines
  # inside them — the skeleton Makefiles are correct and would be flagged. This
  # takes the rules nothing else owns.
  editorconfig:
    name: editorconfig
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # editorconfig-checker ships a Node wrapper around a Go binary it fetches
      # from GitHub releases on first run. Unauthenticated, that request is rate
      # limited per runner IP, which GitHub's shared pool exhausts routinely — so
      # the gate fails with "API rate limit exceeded" on a change it never read.
      # A gate that goes red without looking at the diff teaches people to re-run
      # it rather than read it.
      #
      # GITHUB_TOKEN is the job's own automatic token; it raises the limit and
      # costs no secret to manage.
      #
      # EC_VERSION pins the binary. The npm devDependency pins the wrapper, not
      # the binary — those are separately versioned, and without this the
      # wrapper asks the release API for "latest", so what the gate enforces can
      # change with no commit here. The org preset's customManager tracks this
      # line, so the pin is upgraded like any other dependency rather than
      # quietly going stale.
      - run: npm run editorconfig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # renovate: datasource=github-releases depName=editorconfig-checker/editorconfig-checker
          EC_VERSION: v3.11.1

  validate:
    name: Validate template catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install yq
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6

      # The corpus is asserted against the thing it enumerates rather than
      # against a number. Every directory under templates/ is a template, so
      # "one template.yaml per directory" is an invariant that cannot go stale;
      # a count written here would stay accurate and stay useless, because a
      # corpus that moved out of the depth window would still satisfy it.
      # Every gate under scripts/ refuses an empty corpus by name — this job
      # and the skeleton suites below are inline shell and were the exception,
      # so both reported success over nothing.
      - name: Find and validate templates
        run: |
          failed=0
          dirs=0
          missing=0

          for dir in templates/*/; do
            dir="${dir%/}"
            if [ ! -d "$dir" ]; then
              echo "templates/ holds no directories — the enumeration matched nothing,"
              echo "so this job is asserting nothing."
              exit 1
            fi
            dirs=$((dirs + 1))
            if [ ! -f "$dir/template.yaml" ]; then
              echo "  no template.yaml: $dir"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "$missing of $dirs template directories carry no template.yaml."
            echo "Each one is a template this job cannot validate at all."
            exit 1
          fi

          echo "validating $dirs template(s)"

          for dir in templates/*/; do
            dir="${dir%/}"
            echo "──────────────────────────────────────"
            echo "Validating: $dir"
            echo "──────────────────────────────────────"

            if ! ./scripts/validate.sh "$dir"; then
              failed=1
            fi

            echo ""
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more templates failed validation"
            exit 1
          fi

  validate-catalog:
    name: Validate catalog-level checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install yq
        uses: mikefarah/yq@c14f446382944492701b16c1ddb48bb9dbe683e3 # v4.53.6

      # This repository's own source — the SDK, the MCP server, the shared
      # library, and every script under scripts/. `lint:skeletons` below covers
      # the catalog's scaffolding output, which the root config excludes; nothing
      # covered what lints the catalog. So `npm run lint` sat failing on main,
      # which is the same defect the skeleton gate was built for, one level up:
      # a command the contributing docs tell you to run, that no job runs.
      - name: Lint this repository
        run: npm run lint

      - name: Run catalog validation
        run: npm run validate:catalog

      - name: Validate standards manifests
        run: npm run validate:standards

      # A composite is a manifest kind like a template is, and it had no schema.
      # Consumers filter on `kind`: generate-catalog.mjs and the SDK's
      # LocalSource both skip an entry whose kind is not exactly "composite"
      # rather than rejecting it. So one mistyped character removed a composite
      # from catalog.json, from the render gate's corpus, and from the
      # cross-reference check at once, and every gate stayed green — the
      # regenerated catalog agrees with its own generator, so the drift check
      # sees nothing either. Pinning `kind` in a schema turns the silent skip
      # into a failure at the file that is wrong.
      - name: Validate composite manifests
        run: npm run validate:composites

      # A model ID is a plain string, so no compiler, linter or type checker has
      # an opinion about it — a scaffold born on a retired or never-existent ID
      # fails only at the first invocation, in the consumer's project. This
      # checks every ID against the set standards/llm-policy.json names, and
      # rejects a bare Bedrock foundation-model ID in invoke position (the
      # current Claude family is INFERENCE_PROFILE-only, so those are refused).
      - name: Verify model IDs match the LLM policy
        run: npm run validate:model-ids

      # Same failure shape as a model ID, one field over: a region is a plain
      # string too. A service-control policy denies every non-global action
      # outside the deploy region, so a skeleton defaulting elsewhere fails on
      # its first call — and the AccessDenied it raises reads like a missing IAM
      # permission, not a region guardrail, which is what makes it expensive to
      # diagnose. This checks every region named under templates/ and standards/
      # against the set standards/llm-policy.json lists.
      - name: Verify regions match the LLM policy
        run: npm run validate:regions

      - name: Verify catalog is regenerated (no drift)
        run: npm run verify:catalog

      - name: Verify documented commands exist
        run: npm run validate:doc-commands


      # SLOPolicy builds its PromQL from `sli.metric` plus the suffix `sli.type`
      # implies — it never takes a raw query — so a template's series either fit
      # that shape or the tenant cannot have an objective at all, and the failure
      # is silent: the query resolves to nothing and the policy reports NoData
      # while AgentSLOEvaluationStale pages on a metric that was never there.
      #
      # Two templates were one character from working. ts-service emitted
      # `http_errors_total` beside `http_request_total` — singular — and its own
      # comment called the first "the 'errors' of RED". data-pipeline had the
      # errors half and named its denominator `pipeline_documents_processed`.
      - name: Verify SLI metric names
        run: npm run validate:sli-metric-names

      # npm does not rewrite `file:`/`link:` specifiers at publish time, and a
      # package that carries one to the registry installs cleanly, omits the
      # dependency, and crashes on the consumer's first import. The development
      # tree resolves the path fine, so lint, typecheck and the test suites all
      # pass on a manifest that is already broken downstream — this is the only
      # step that can see it.
      - name: Verify no local-path deps in publishable packages
        run: npm run validate:publishable-deps

      # A skeleton is what a consumer's project starts as, and the root
      # biome.json excludes templates/*/skeleton — it has to, since each
      # skeleton is scaffolding output with its own root and config. These two
      # steps are what read them: the first asserts every skeleton carries the
      # shared Biome config, the second asserts its code passes it, running the
      # same command from the same directory a consumer would.
      - name: Verify skeletons ship the shared toolchain
        run: npm run validate:skeleton-toolchain

      - name: Lint every skeleton against its own config
        run: npm run lint:skeletons

      - name: Verify vendored library copies are in sync
        run: npm run verify:library

      # Every gate above this line reads the catalog UNRENDERED — the schema
      # validator checks template.yaml, the skeleton linter lints files with
      # placeholders still in them, and validate.sh asserts placeholders ARE
      # present. All of them pass on a template that throws the moment anyone
      # scaffolds it, which is what shipped once: a skeleton that could not
      # render at all, and every composite including it went down with it. This
      # is the only check that runs the thing the repository sells.
      - name: Build the SDK the catalog renders through
        run: npm --prefix sdk ci && npm --prefix sdk run build

      - name: Verify every template and composite renders
        run: node scripts/check-catalog-renders.mjs

  test-templates:
    name: Test template skeletons
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Run template tests
        run: |
          failed=0
          tested=0
          found=0
          skipped=0

          # Every package.json under a skeleton, not just the one at its root.
          # A skeleton whose code lives a directory deeper (prompt-library/sdk,
          # monorepo/packages/*) was invisible to a `templates/*/skeleton/`
          # glob, so its suite never ran here — which is how prompt-library
          # shipped a test suite that had been failing outright. Deepening the
          # glob fixed that instance and left the class open: the loop reports
          # success over whatever it happens to find, so the next corpus that
          # moves goes quiet the same way. The three counters below close it —
          # every manifest discovered is accounted for as tested or skipped,
          # and a discovery of nothing is a failure rather than a clean run.
          while IFS= read -r pkg; do
            [ -f "$pkg" ] || continue
            dir=$(dirname "$pkg")
            found=$((found + 1))

            # A manifest that cannot be parsed is a broken skeleton, not a
            # skeleton without tests. Reading the two as the same thing is how
            # a suite leaves the run without anything saying so.
            if ! node -e "JSON.parse(require('node:fs').readFileSync('$pkg','utf8'))" 2>/dev/null; then
              echo "FAIL: $pkg is not readable JSON"
              failed=1
              continue
            fi

            if ! node -e "const p = require('./$pkg'); if (!p.scripts || !p.scripts.test) process.exit(1);"; then
              echo "no test script, skipping: $dir"
              skipped=$((skipped + 1))
              continue
            fi

            echo "──────────────────────────────────────"
            echo "Testing: $dir"
            echo "──────────────────────────────────────"
            tested=$((tested + 1))

            if ! (cd "$dir" && npm install --ignore-scripts && npm test); then
              echo "FAIL: $dir"
              failed=1
            fi

            echo ""
          done < <(find templates -mindepth 3 -name package.json -not -path '*/node_modules/*' | sort)

          echo "──────────────────────────────────────"
          echo "Manifests found: $found — tested: $tested, skipped: $skipped"
          echo "──────────────────────────────────────"

          if [ "$found" -eq 0 ]; then
            echo "found no package.json under templates/ — the discovery matched"
            echo "nothing, so this job is asserting nothing."
            exit 1
          fi

          if [ "$((tested + skipped))" -ne "$found" ]; then
            echo "$found manifests were discovered but only $tested + $skipped are"
            echo "accounted for. A manifest that left the run unexplained is a suite"
            echo "nothing ran and nothing reported."
            exit 1
          fi

          if [ "$tested" -eq 0 ]; then
            echo "every discovered manifest declared no test script. The catalog ships"
            echo "JavaScript skeletons with suites, so this is the discovery breaking,"
            echo "not the catalog losing its tests."
            exit 1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "One or more template tests failed"
            exit 1
          fi

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs:
      [
        audit,
        editorconfig,
        validate,
        validate-catalog,
        test-templates,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to the two events a merge can come through, because the gate
    # treats a skipped dependency as a failure and a job carrying
    # `if: github.event_name == 'pull_request'` is legitimately skipped on a push
    # to main. On push it is skipped and gates nothing.
    #
    # merge_group is the other one: the queue tests each entry on a temporary
    # branch, and a required check that does not report there stalls the queue
    # indefinitely.
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
