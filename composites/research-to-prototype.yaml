apiVersion: nanohype/v1
kind: composite
name: research-to-prototype
displayName: 'Research to Prototype'
description: >
  Research-driven prototype pipeline. Starts with product research
  and a PRD, scaffolds an agentic loop prototype, and optionally
  adds a test plan for validation.
version: '0.1.0'
tags: [research, prototype, product, ai, qa]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Project name used across all templates'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: ResearchType
    type: string
    placeholder: '__RESEARCH_TYPE__'
    description: 'Type of research (generative, evaluative)'
    default: 'generative'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider: gateway (the Platform ModelGateway, the only route to a model on the nanohype substrate), or off the substrate anthropic or openai with IncludeKeyProviders'
    default: 'gateway'

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the API-key providers in every package that carries them, for a stack that runs off the substrate with the provider key the intake brief names'
    default: false

  - name: IncludeTests
    type: bool
    placeholder: '__INCLUDE_TESTS__'
    description: 'Include test plan for prototype validation'
    default: true

templates:
  - template: monorepo
    root: true
    variables:
      ProjectName: '${ProjectName}'
      IncludeSharedUtils: false

  - template: research-framework
    path: docs/research
    variables:
      ProjectName: '${ProjectName}-research'
      ResearchType: '${ResearchType}'

  - template: prd-template
    path: docs/product
    variables:
      ProjectName: '${ProjectName}-prd'
      ProductName: '${ProjectName}'
      IncludeUserStories: true
      IncludeMetrics: false

  - template: agentic-loop
    path: apps/agent
    variables:
      ProjectName: '${ProjectName}-agent'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      LlmProvider: '${LlmProvider}'
      IncludeMemory: true
      IncludeEval: false

  - template: test-plan
    path: docs/qa
    condition: IncludeTests
    variables:
      ProjectName: '${ProjectName}-qa'
