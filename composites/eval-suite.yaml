apiVersion: nanohype/v1
kind: composite
name: eval-suite
displayName: 'AI Evaluation Suite'
description: >
  Standalone evaluation infrastructure with test harness,
  versioned prompts, and guardrails validation. For teams
  that need to test AI systems without building them.
version: '0.1.0'
tags: [eval, testing, prompts, ai, quality]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider for eval targets: bedrock on a CI runner or a workstation, under an IAM role the run assumes (GitHub OIDC federation on a runner, an AWS profile on a workstation); gateway for a run inside the cluster; anthropic or openai with IncludeKeyProviders'
    default: 'bedrock'

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the anthropic and openai providers, which authenticate with a provider API key, for a provider the intake brief names'
    default: false

  - name: ProviderCheck
    type: string
    placeholder: '__PROVIDER_CHECK__'
    description: 'Derived from LlmProvider and IncludeKeyProviders, and takes no value of its own. It fails the scaffold when LlmProvider names a key provider the stack leaves out, before any package renders'
    derived: true
    default: '${LlmProvider}:${IncludeKeyProviders}'
    validation:
      pattern: '(?!(?:anthropic|openai):false$).*'
      message: 'LlmProvider anthropic and openai authenticate with a provider API key, and the stack carries them only with IncludeKeyProviders=true; LlmProvider is bedrock on a CI runner'

  - name: IncludeGuardrails
    type: bool
    placeholder: '__INCLUDE_GUARDRAILS__'
    description: 'Include safety filter testing'
    default: true

templates:
  - template: monorepo
    root: true
    variables:
      ProjectName: '${ProjectName}'
      IncludeSharedUtils: true

  - template: eval-harness
    path: packages/evals
    variables:
      ProjectName: '${ProjectName}-evals'
      PlatformName: '${ProjectName}'
      LlmProvider: '${LlmProvider}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      IncludeCi: true

  - template: prompt-library
    path: packages/prompts
    variables:
      ProjectName: '${ProjectName}-prompts'
      IncludeSdk: true

  - template: guardrails
    path: packages/guardrails
    condition: IncludeGuardrails
    variables:
      ProjectName: '${ProjectName}-guardrails'
