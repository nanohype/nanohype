apiVersion: nanohype/v1
kind: composite
name: multi-agent
displayName: 'Multi-Agent System'
description: >
  Multi-agent architecture with A2A protocol peers, MCP tool
  servers, and an orchestrating agent. Agents discover each
  other, delegate tasks, and share tools.
version: '0.1.0'
tags: [ai, agents, a2a, mcp, multi-agent]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider: gateway (the Platform ModelGateway, the only route to a model on the nanohype substrate), or off the substrate anthropic or openai with IncludeKeyProviders'
    default: 'gateway'

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the API-key providers in every package that carries them, for a stack that runs off the substrate with the provider key the intake brief names'
    default: false

  - name: IncludeGuardrails
    type: bool
    placeholder: '__INCLUDE_GUARDRAILS__'
    description: 'Include safety guardrails'
    default: true

templates:
  - template: monorepo
    root: true
    variables:
      ProjectName: '${ProjectName}'
      IncludeSharedUtils: true

  - template: a2a-agent
    path: packages/orchestrator
    variables:
      ProjectName: '${ProjectName}-orchestrator'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      LlmProvider: '${LlmProvider}'
      IncludeDiscovery: true

  - template: agentic-loop
    path: packages/agent
    variables:
      ProjectName: '${ProjectName}-agent'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      LlmProvider: '${LlmProvider}'
      IncludeMemory: true

  - template: mcp-server-ts
    path: packages/tools
    variables:
      ProjectName: '${ProjectName}-tools'
      ServerName: '${ProjectName} Tools'
      Transport: 'stdio'

  - template: guardrails
    path: packages/guardrails
    condition: IncludeGuardrails
    variables:
      ProjectName: '${ProjectName}-guardrails'

  - template: eval-harness
    path: packages/evals
    variables:
      ProjectName: '${ProjectName}-evals'
      PlatformName: '${ProjectName}'
      # Evals run on a CI runner, off the substrate, with the provider key
      # the intake brief names, so the harness keeps its own provider default.

  - template: ts-service
    path: apps/api
    variables:
      ProjectName: '${ProjectName}-api'

  - template: module-auth-ts
    path: packages/auth
    variables:
      ProjectName: '${ProjectName}-auth'

  - template: k8s-deploy
    path: infra
    variables:
      ProjectName: '${ProjectName}'
      IncludeHelm: true
      IncludeHpa: true
      IncludeCi: true
