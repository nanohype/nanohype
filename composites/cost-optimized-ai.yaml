apiVersion: nanohype/v1
kind: composite
name: cost-optimized-ai
displayName: 'Cost-Optimized AI Stack'
description: >
  Minimize LLM costs with intelligent routing, response caching,
  and cost monitoring. Routes to the cheapest provider that meets
  quality thresholds, caches similar prompts to avoid redundant calls,
  and tracks spend with anomaly detection.
version: '0.1.0'
tags: [ai, cost, optimization, caching]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Project name used across all templates'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider: gateway (the Platform ModelGateway, the only route to a model on the nanohype substrate), or off the substrate anthropic or openai with IncludeKeyProviders'
    default: 'gateway'

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the API-key providers in every package that carries them, for a stack that runs off the substrate with the provider key the intake brief names'
    default: false

templates:
  - template: monorepo
    root: true
    variables:
      ProjectName: '${ProjectName}'
      IncludeSharedUtils: true

  - template: module-llm-gateway
    path: packages/gateway
    variables:
      ProjectName: '${ProjectName}-gateway'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      DefaultProvider: '${LlmProvider}'
      RoutingStrategy: 'cost'

  - template: module-semantic-cache
    path: packages/cache
    variables:
      ProjectName: '${ProjectName}-cache'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      EmbeddingProvider: 'gateway'

  - template: module-llm-observability
    path: packages/observability
    variables:
      ProjectName: '${ProjectName}-observability'
      Exporter: 'console'
