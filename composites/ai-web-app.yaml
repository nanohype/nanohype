apiVersion: nanohype/v1
kind: composite
name: ai-web-app
displayName: 'AI Web Application'
description: >
  Full-stack web application with Next.js frontend, RAG pipeline,
  authentication, database, and a Platform tenant chart whose
  ModelGateway is the app's model path.
version: '0.1.0'
tags: [ai, nextjs, fullstack, rag, typescript]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Project name used across all templates'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider every package calls: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), so no package holds a model credential'
    default: 'gateway'

  - name: IncludeRag
    type: bool
    placeholder: '__INCLUDE_RAG__'
    description: 'Include RAG pipeline for document search'
    default: true

  - name: IncludeEvals
    type: bool
    placeholder: '__INCLUDE_EVALS__'
    description: 'Include evaluation harness'
    default: true

  - name: Tenant
    type: string
    placeholder: '__TENANT__'
    description: 'Owning team: the tenants-<team> namespace the Platform, BudgetPolicy and ModelGateway CRs are applied in, the Platform''s spec.tenant, and the team label on the tenant chart''s resources and telemetry'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: Image
    type: string
    placeholder: '__IMAGE__'
    description: 'Container image repository the tenant chart deploys, without a tag; each values-<env>.yaml pins one'
    default: '${ProjectName}'

  - name: AppMetric
    type: string
    placeholder: '__APP_METRIC__'
    description: 'Prefix of the RED series the tenant chart''s Grafana dashboard reads: <prefix>_requests_total, <prefix>_errors_total and <prefix>_request_duration_seconds. The default, http, is the prefix a ts-service emits them under; set it to the prefix the deployed service emits'
    default: 'http'
    validation:
      pattern: '^[a-z][a-z0-9_]*$'
      message: 'Must be lowercase snake_case: it prefixes Prometheus metric names'

templates:
  - template: monorepo
    root: true
    variables:
      ProjectName: '${ProjectName}'
      IncludeSharedUtils: true
      IncludeSharedUi: true

  - template: next-app
    path: apps/web
    variables:
      ProjectName: '${ProjectName}-web'
      PlatformName: '${ProjectName}'
      LlmProvider: '${LlmProvider}'
      IncludeAuth: true
      IncludeDatabase: true
      IncludeDocker: false

  - template: rag-pipeline
    path: packages/rag
    condition: IncludeRag
    variables:
      ProjectName: '${ProjectName}-rag'
      PlatformName: '${ProjectName}'
      LlmProvider: '${LlmProvider}'
      VectorStore: 'pgvector'

  - template: module-auth-ts
    path: packages/auth
    variables:
      ProjectName: '${ProjectName}-auth'
      AuthProvider: 'clerk'

  - template: module-database-ts
    path: packages/db
    variables:
      ProjectName: '${ProjectName}-db'
      DatabaseDriver: 'postgres'

  - template: module-observability-ts
    path: packages/observability
    variables:
      ProjectName: '${ProjectName}-otel'
      Exporter: 'otlp'

  - template: eval-harness
    path: packages/evals
    condition: IncludeEvals
    variables:
      ProjectName: '${ProjectName}-evals'
      PlatformName: '${ProjectName}'
      # Evals run on a CI runner, off the substrate, so the harness keeps its
      # own provider default: bedrock, under the IAM role the eval workflow
      # assumes through GitHub OIDC federation.

  # The deploy unit: the Helm chart with its per-env values and ApplicationSet
  # entry, and the Platform, BudgetPolicy and ModelGateway CRs. The
  # ModelGateway is the model path every gateway provider above calls: the
  # operator runs it as the Service <ProjectName>-gateway, which the chart
  # hands the app as MODEL_GATEWAY_ENDPOINT.
  - template: k8s-app-tenant
    path: infra
    variables:
      AppName: '${ProjectName}'
      AppMetric: '${AppMetric}'
      Tenant: '${Tenant}'
      Image: '${Image}'
      Port: '3000'
      IncludeEmbeddingRoute: '${IncludeRag}'
