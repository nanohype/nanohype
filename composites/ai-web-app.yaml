apiVersion: nanohype/v1
kind: composite
name: ai-web-app
displayName: 'AI Web Application'
description: >
  Full-stack web application with Next.js frontend, RAG pipeline,
  authentication, database, and deployment.
version: '0.1.0'
tags: [ai, nextjs, fullstack, rag, typescript]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Project name used across all templates'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider: gateway (the Platform ModelGateway, the only route to a model on the nanohype substrate), or off the substrate anthropic or openai with IncludeKeyProviders'
    default: 'gateway'

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the API-key providers in every package that carries them, for a stack that runs off the substrate with the provider key the intake brief names'
    default: false

  - name: IncludeRag
    type: bool
    placeholder: '__INCLUDE_RAG__'
    description: 'Include RAG pipeline for document search'
    default: true

  - name: IncludeEvals
    type: bool
    placeholder: '__INCLUDE_EVALS__'
    description: 'Include evaluation harness'
    default: true

templates:
  - template: monorepo
    root: true
    variables:
      ProjectName: '${ProjectName}'
      IncludeSharedUtils: true
      IncludeSharedUi: true

  - template: next-app
    path: apps/web
    variables:
      ProjectName: '${ProjectName}-web'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      LlmProvider: '${LlmProvider}'
      IncludeAuth: true
      IncludeDatabase: true
      IncludeDocker: false

  - template: rag-pipeline
    path: packages/rag
    condition: IncludeRag
    variables:
      ProjectName: '${ProjectName}-rag'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      LlmProvider: '${LlmProvider}'
      VectorStore: 'pgvector'

  - template: module-auth-ts
    path: packages/auth
    variables:
      ProjectName: '${ProjectName}-auth'
      AuthProvider: 'clerk'

  - template: module-database-ts
    path: packages/db
    variables:
      ProjectName: '${ProjectName}-db'
      DatabaseDriver: 'postgres'

  - template: module-observability-ts
    path: packages/observability
    variables:
      ProjectName: '${ProjectName}-otel'
      Exporter: 'otlp'

  - template: eval-harness
    path: packages/evals
    condition: IncludeEvals
    variables:
      ProjectName: '${ProjectName}-evals'
      PlatformName: '${ProjectName}'
      # Evals run on a CI runner, off the substrate, with the provider key
      # the intake brief names, so the harness keeps its own provider default.

  - template: k8s-deploy
    path: infra
    variables:
      ProjectName: '${ProjectName}'
      IncludeHelm: true
      IncludeIngress: true
      IncludeHpa: true
      IncludeCi: true
