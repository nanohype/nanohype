apiVersion: nanohype/v1
kind: composite
name: product-launch
displayName: 'Product Launch'
description: >
  Full product launch kit spanning engineering, design, QA, product,
  marketing, and operations. Scaffolds a Next.js app with auth and
  analytics and a Platform tenant chart whose ModelGateway is the app's
  model path, alongside a design system, design tokens, test plan,
  acceptance criteria, PRD, campaign brief, and operational runbook.
version: '0.1.0'
tags: [launch, cross-functional, product, design, qa, marketing, operations]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Project name used across all templates'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: ProductName
    type: string
    placeholder: '__PRODUCT_NAME__'
    description: 'Human-readable product name'
    required: true

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), or off the substrate anthropic or openai with IncludeKeyProviders'
    default: 'gateway'

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the API-key providers in every package that carries them, for a stack that runs off the substrate with the provider key the intake brief names'
    default: false

  - name: ProviderCheck
    type: string
    placeholder: '__PROVIDER_CHECK__'
    description: 'Derived from LlmProvider and IncludeKeyProviders, and takes no value of its own. It fails the scaffold when LlmProvider names a key provider the stack leaves out, before any package renders'
    derived: true
    default: '${LlmProvider}:${IncludeKeyProviders}'
    validation:
      pattern: '(?!(?:anthropic|openai):false$).*'
      message: 'LlmProvider anthropic and openai authenticate with a provider API key, and the stack carries them only with IncludeKeyProviders=true; on the nanohype substrate LlmProvider is gateway'

  - name: IncludeMarketing
    type: bool
    placeholder: '__INCLUDE_MARKETING__'
    description: 'Include marketing campaign brief'
    default: true

  - name: Tenant
    type: string
    placeholder: '__TENANT__'
    description: 'Owning team: the tenants-<team> namespace the Platform, BudgetPolicy and ModelGateway CRs are applied in, the Platform''s spec.tenant, and the team label on the tenant chart''s resources and telemetry'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: Image
    type: string
    placeholder: '__IMAGE__'
    description: 'Container image repository the tenant chart deploys, without a tag; each values-<env>.yaml pins one'
    default: '${ProjectName}'

  - name: AppMetric
    type: string
    placeholder: '__APP_METRIC__'
    description: 'Prefix of the RED series the tenant chart''s Grafana dashboard reads: <prefix>_requests_total, <prefix>_errors_total and <prefix>_request_duration_seconds. The default, http, is the prefix a ts-service emits them under; set it to the prefix the deployed service emits'
    default: 'http'
    validation:
      pattern: '^[a-z][a-z0-9_]*$'
      message: 'Must be lowercase snake_case: it prefixes Prometheus metric names'

templates:
  - template: monorepo
    root: true
    variables:
      ProjectName: '${ProjectName}'
      IncludeSharedUtils: true

  - template: prd-template
    path: docs/product
    variables:
      ProjectName: '${ProjectName}-prd'
      ProductName: '${ProductName}'
      IncludeUserStories: true
      IncludeMetrics: true

  - template: design-system
    path: docs/design
    variables:
      ProjectName: '${ProjectName}-design'

  - template: design-tokens
    path: packages/tokens
    variables:
      ProjectName: '${ProjectName}-tokens'

  - template: next-app
    path: apps/web
    variables:
      ProjectName: '${ProjectName}-web'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      LlmProvider: '${LlmProvider}'
      IncludeAuth: true

  - template: module-auth-ts
    path: packages/auth
    variables:
      ProjectName: '${ProjectName}-auth'

  - template: module-analytics-ts
    path: packages/analytics
    variables:
      ProjectName: '${ProjectName}-analytics'

  - template: test-plan
    path: docs/qa
    variables:
      ProjectName: '${ProjectName}-qa'

  - template: acceptance-criteria
    path: docs/qa/criteria
    variables:
      ProjectName: '${ProjectName}-criteria'

  - template: runbook
    path: docs/ops
    variables:
      ProjectName: '${ProjectName}-ops'
      ServiceName: '${ProjectName}-web'

  - template: campaign-brief
    path: docs/marketing
    condition: IncludeMarketing
    variables:
      ProjectName: '${ProjectName}-campaign'
      CampaignName: '${ProductName} Launch'

  # The deploy unit: the Helm chart with its per-env values and ApplicationSet
  # entry, and the Platform, BudgetPolicy and ModelGateway CRs. The
  # ModelGateway is the model path every gateway provider above calls: the
  # operator runs it as the Service <ProjectName>-gateway, which the chart
  # hands the app as MODEL_GATEWAY_ENDPOINT.
  - template: k8s-app-tenant
    path: infra
    variables:
      AppName: '${ProjectName}'
      AppMetric: '${AppMetric}'
      Tenant: '${Tenant}'
      Image: '${Image}'
      Port: '3000'
