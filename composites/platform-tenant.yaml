apiVersion: nanohype/v1
kind: composite
name: platform-tenant
displayName: 'Platform Tenant'
description: >
  One-shot scaffolder for a k8s-native nanohype Platform tenant: the
  k8s-app-tenant chart (which vendors tenant-chart-base and ships per-env values,
  an ArgoCD ApplicationSet entry, and the Platform, BudgetPolicy and ModelGateway CRs) plus the
  optional AI building blocks as local packages — the LLM gateway and the vector
  store. The output satisfies the platform-tenant-contract: a chart with the
  required templates, the gitops entry, and the Platform CR, with the OTel
  agents.tenant / agents.platform attributes set and no inline IAM. Pair the
  packages with a ts-service or agentic-loop for the app's own logic.
version: '0.1.0'
tags: [kubernetes, platform, tenant, ai, nanohype]

variables:
  - name: AppName
    type: string
    placeholder: '__APP_NAME__'
    description: 'Kebab-case app name — chart name, namespace, Platform CR name, and the package prefix.'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case starting with a letter'

  - name: Tenant
    type: string
    placeholder: '__TENANT__'
    description: 'Owning team: the tenants-<team> namespace the Platform, BudgetPolicy and ModelGateway CRs are applied in, the Platform''s spec.tenant, and the team label on the chart''s resources and telemetry.'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: Image
    type: string
    placeholder: '__IMAGE__'
    description: 'Container image base (no tag — pinned per-env in values-{env}.yaml).'
    required: true

  - name: AppMetric
    type: string
    placeholder: '__APP_METRIC__'
    description: 'Prefix of the RED series the tenant chart''s Grafana dashboard reads: <prefix>_requests_total, <prefix>_errors_total and <prefix>_request_duration_seconds. AppName with each dash as an underscore, the prefix the chart''s PrometheusRule derives from the chart name; a single-word AppName needs nothing'
    default: '${AppName}'
    validation:
      pattern: '^[a-z][a-z0-9_]*$'
      message: 'Must be lowercase snake_case: set AppMetric to AppName with each dash as an underscore'

  - name: Description
    type: string
    placeholder: '__DESCRIPTION__'
    description: 'Short app description for Chart.yaml and README.'
    default: 'k8s-native Platform tenant'

  - name: Port
    type: string
    placeholder: '__PORT__'
    description: 'Container port the app listens on.'
    default: '8080'

  - name: IncludeLlmGateway
    type: bool
    placeholder: '__INCLUDE_LLM_GATEWAY__'
    description: 'Include the LLM gateway package (routing + caching + cost tracking, over the Platform ModelGateway by default).'
    default: true

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), or off the substrate anthropic or openai with IncludeKeyProviders'
    default: 'gateway'

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the API-key providers in every package that carries them, for a stack that runs off the substrate with the provider key the intake brief names'
    default: false

  - name: ProviderCheck
    type: string
    placeholder: '__PROVIDER_CHECK__'
    description: 'Derived from LlmProvider and IncludeKeyProviders, and takes no value of its own. It fails the scaffold when LlmProvider names a key provider the stack leaves out, before any package renders'
    derived: true
    default: '${LlmProvider}:${IncludeKeyProviders}'
    validation:
      pattern: '(?!(?:anthropic|openai|groq):false$).*'
      message: 'LlmProvider anthropic, openai and groq authenticate with a provider API key, and the stack carries them only with IncludeKeyProviders=true; on the nanohype substrate LlmProvider is gateway'

  - name: IncludeVectorStore
    type: bool
    placeholder: '__INCLUDE_VECTOR_STORE__'
    description: 'Include the vector store package (embedding storage + similarity search).'
    default: false

  - name: VectorProvider
    type: string
    placeholder: '__VECTOR_PROVIDER__'
    description: 'Default vector store backend.'
    default: 'memory'

  - name: IncludeAuditLedger
    type: bool
    placeholder: '__INCLUDE_AUDIT_LEDGER__'
    description: 'Include the audit ledger package (append-only event log over pluggable storage).'
    default: false

  - name: AuditProvider
    type: string
    placeholder: '__AUDIT_PROVIDER__'
    description: 'Default audit ledger backend.'
    default: 'memory'

templates:
  - template: k8s-app-tenant
    root: true
    variables:
      AppName: '${AppName}'
      AppMetric: '${AppMetric}'
      Tenant: '${Tenant}'
      Image: '${Image}'
      Description: '${Description}'
      Port: '${Port}'

  - template: module-llm-gateway
    path: packages/gateway
    condition: IncludeLlmGateway
    variables:
      ProjectName: '${AppName}-gateway'
      PlatformName: '${AppName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      DefaultProvider: '${LlmProvider}'

  - template: module-vector-store
    path: packages/vectors
    condition: IncludeVectorStore
    variables:
      ProjectName: '${AppName}-vectors'
      VectorProvider: '${VectorProvider}'

  - template: module-audit-ledger-ts
    path: packages/audit
    condition: IncludeAuditLedger
    variables:
      ProjectName: '${AppName}-audit'
      AuditProvider: '${AuditProvider}'
