apiVersion: nanohype/v1
kind: composite
name: ai-platform
displayName: 'AI Platform'
description: >
  Full AI platform with HTTP service, LLM gateway, vector store,
  data pipeline, auth, billing, monitoring, and a Platform tenant chart
  whose ModelGateway serves the gateway's and the pipeline's model
  routes. Everything needed to ship a production AI product with
  usage-based billing and operational visibility.
version: '0.1.0'
tags: [ai, platform, fullstack, billing, typescript]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Project name used across all templates'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider the packages deployed on the substrate call: gateway, the Platform ModelGateway, which holds the Bedrock role there, so none of them holds a model credential'
    default: 'gateway'

  - name: DatabaseDriver
    type: string
    placeholder: '__DATABASE_DRIVER__'
    description: 'Database driver'
    default: 'postgres'

  - name: IncludeBilling
    type: bool
    placeholder: '__INCLUDE_BILLING__'
    description: 'Include billing and usage tracking'
    default: true

  - name: Tenant
    type: string
    placeholder: '__TENANT__'
    description: 'Owning team: the tenants-<team> namespace the Platform, BudgetPolicy and ModelGateway CRs are applied in, the Platform''s spec.tenant, and the team label on the tenant chart''s resources and telemetry'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: Image
    type: string
    placeholder: '__IMAGE__'
    description: 'Container image repository the tenant chart deploys, without a tag; each values-<env>.yaml pins one'
    default: '${ProjectName}'

  - name: AppMetric
    type: string
    placeholder: '__APP_METRIC__'
    description: 'Prefix of the RED series the tenant chart''s Grafana dashboard reads: <prefix>_requests_total, <prefix>_errors_total and <prefix>_request_duration_seconds. The default, http, is the prefix apps/api (a ts-service) emits them under'
    default: 'http'
    validation:
      pattern: '^[a-z][a-z0-9_]*$'
      message: 'Must be lowercase snake_case: it prefixes Prometheus metric names'

templates:
  - template: monorepo
    root: true
    variables:
      ProjectName: '${ProjectName}'
      IncludeSharedUtils: true

  - template: ts-service
    path: apps/api
    variables:
      ProjectName: '${ProjectName}-api'
      IncludeDocker: true

  - template: module-llm-gateway
    path: packages/gateway
    variables:
      ProjectName: '${ProjectName}-gateway'
      PlatformName: '${ProjectName}'
      DefaultProvider: '${LlmProvider}'

  - template: module-vector-store
    path: packages/vectors
    variables:
      ProjectName: '${ProjectName}-vectors'

  - template: data-pipeline
    path: packages/pipeline
    variables:
      ProjectName: '${ProjectName}-pipeline'
      PlatformName: '${ProjectName}'

  - template: module-auth-ts
    path: packages/auth
    variables:
      ProjectName: '${ProjectName}-auth'
      AuthProvider: 'jwt'

  - template: module-billing-ts
    path: packages/billing
    condition: IncludeBilling
    variables:
      ProjectName: '${ProjectName}-billing'

  - template: module-database-ts
    path: packages/db
    variables:
      ProjectName: '${ProjectName}-db'
      DatabaseDriver: '${DatabaseDriver}'

  - template: monitoring-stack
    path: infra/monitoring
    variables:
      ProjectName: '${ProjectName}-monitoring'

  # The deploy unit: the Helm chart with its per-env values and ApplicationSet
  # entry, and the Platform, BudgetPolicy and ModelGateway CRs. The
  # ModelGateway is the model path every gateway provider above calls: the
  # operator runs it as the Service <ProjectName>-gateway, which the chart
  # hands the app as MODEL_GATEWAY_ENDPOINT.
  - template: k8s-app-tenant
    path: infra
    variables:
      AppName: '${ProjectName}'
      AppMetric: '${AppMetric}'
      Tenant: '${Tenant}'
      Image: '${Image}'
      Port: '3000'
      IncludeEmbeddingRoute: true
