apiVersion: nanohype/v1
kind: composite
name: enterprise-ai
displayName: 'Enterprise AI Infrastructure'
description: >
  Full enterprise AI stack with agents, tool servers, safety
  guardrails, evaluation, prompt management, observability,
  and a Platform tenant chart whose ModelGateway is the stack's model path.
version: '0.1.0'
tags: [enterprise, ai, kubernetes, agents, guardrails]

variables:
  - name: ProjectName
    type: string
    placeholder: '__PROJECT_NAME__'
    description: 'Project name'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: LlmProvider
    type: string
    placeholder: '__LLM_PROVIDER__'
    description: 'LLM provider: gateway (the Platform ModelGateway, which holds the Bedrock role on the nanohype substrate), or off the substrate anthropic or openai with IncludeKeyProviders'
    default: 'gateway'

  - name: IncludeKeyProviders
    type: bool
    placeholder: '__INCLUDE_KEY_PROVIDERS__'
    description: 'Include the API-key providers in every package that carries them, for a stack that runs off the substrate with the provider key the intake brief names'
    default: false

  - name: ProviderCheck
    type: string
    placeholder: '__PROVIDER_CHECK__'
    description: 'Derived from LlmProvider and IncludeKeyProviders; leave it at its default. It fails the scaffold when LlmProvider names a key provider the stack leaves out, before any package renders'
    default: '${LlmProvider}:${IncludeKeyProviders}'
    validation:
      pattern: '(?!(?:anthropic|openai):false$).*'
      message: 'LlmProvider anthropic and openai authenticate with a provider API key, and the stack carries them only with IncludeKeyProviders=true; on the nanohype substrate LlmProvider is gateway'

  - name: IncludeRag
    type: bool
    placeholder: '__INCLUDE_RAG__'
    description: 'Include RAG pipeline'
    default: true

  - name: IncludeA2a
    type: bool
    placeholder: '__INCLUDE_A2A__'
    description: 'Include multi-agent coordination'
    default: false

  - name: Tenant
    type: string
    placeholder: '__TENANT__'
    description: 'Owning team: the tenants-<team> namespace the Platform, BudgetPolicy and ModelGateway CRs live in, the ArgoCD AppProject, and the quotas'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9-]*$'
      message: 'Must be lowercase kebab-case'

  - name: Image
    type: string
    placeholder: '__IMAGE__'
    description: 'Container image repository the tenant chart deploys, without a tag; each values-<env>.yaml pins one'
    default: '${ProjectName}'

  - name: AppMetric
    type: string
    placeholder: '__APP_METRIC__'
    description: 'Metric-name prefix for the tenant chart''s RED/SLO panels and burn-rate rules: ProjectName with each dash as an underscore. A single-word ProjectName needs nothing'
    default: '${ProjectName}'
    validation:
      pattern: '^[a-z][a-z0-9_]*$'
      message: 'Must be lowercase snake_case: set AppMetric to ProjectName with each dash as an underscore'

templates:
  - template: monorepo
    root: true
    variables:
      ProjectName: '${ProjectName}'
      IncludeSharedUtils: true

  - template: agentic-loop
    path: packages/agent
    variables:
      ProjectName: '${ProjectName}-agent'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      LlmProvider: '${LlmProvider}'
      IncludeMemory: true

  - template: mcp-server-ts
    path: packages/tools
    variables:
      ProjectName: '${ProjectName}-tools'
      ServerName: '${ProjectName} Tools'

  - template: guardrails
    path: packages/guardrails
    variables:
      ProjectName: '${ProjectName}-guardrails'
      IncludePii: true
      IncludeContentPolicy: true

  - template: rag-pipeline
    path: packages/rag
    condition: IncludeRag
    variables:
      ProjectName: '${ProjectName}-rag'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      LlmProvider: '${LlmProvider}'
      VectorStore: 'pgvector'

  - template: a2a-agent
    path: packages/orchestrator
    condition: IncludeA2a
    variables:
      ProjectName: '${ProjectName}-orchestrator'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      LlmProvider: '${LlmProvider}'

  - template: eval-harness
    path: packages/evals
    variables:
      ProjectName: '${ProjectName}-evals'
      PlatformName: '${ProjectName}'
      IncludeKeyProviders: '${IncludeKeyProviders}'
      # Evals run on a CI runner, off the substrate, so the harness keeps its
      # own provider default: bedrock, under the IAM role the eval workflow
      # assumes through GitHub OIDC federation.

  - template: prompt-library
    path: packages/prompts
    variables:
      ProjectName: '${ProjectName}-prompts'

  - template: ts-service
    path: apps/api
    variables:
      ProjectName: '${ProjectName}-api'
      IncludeDocker: true

  - template: module-auth-ts
    path: packages/auth
    variables:
      ProjectName: '${ProjectName}-auth'

  - template: module-database-ts
    path: packages/db
    variables:
      ProjectName: '${ProjectName}-db'
      DatabaseDriver: 'postgres'

  - template: module-observability-ts
    path: packages/observability
    variables:
      ProjectName: '${ProjectName}-otel'
      Exporter: 'otlp'

  - template: module-queue-ts
    path: packages/queue
    variables:
      ProjectName: '${ProjectName}-queue'
      QueueProvider: 'bullmq'

  - template: module-storage-ts
    path: packages/storage
    variables:
      ProjectName: '${ProjectName}-storage'
      StorageProvider: 's3'

  # The deploy unit: the Helm chart with its per-env values and ApplicationSet
  # entry, and the Platform, BudgetPolicy and ModelGateway CRs. The
  # ModelGateway is the model path every gateway provider above calls: the
  # operator runs it as the Service <ProjectName>-gateway, which the chart
  # hands the app as MODEL_GATEWAY_ENDPOINT.
  - template: k8s-app-tenant
    path: infra
    variables:
      AppName: '${ProjectName}'
      AppMetric: '${AppMetric}'
      Tenant: '${Tenant}'
      Image: '${Image}'
      Port: '3000'
      IncludeEmbeddingRoute: '${IncludeRag}'
